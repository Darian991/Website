<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.product">Entwurf — Maison Noir</title>
<meta name="description" data-i18n-content="desc.product" content="Materialien, Maße und Ausführungen zu den Entwürfen von Maison Noir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="site-header">
<noscript>
  <div class="topbar">Versandkostenfrei innerhalb Europas · Persönliche Beratung unter +49 89 1234 5678</div>
  <header class="header"><div class="wrap header__inner">
    <a class="logo" href="index.html">Maison Noir<small>Möbelmanufaktur</small></a>
    <nav class="nav-static">
      <a href="index.html">Startseite</a>
      <a href="kollektion.html" class="is-active">Kollektion</a>
      <a href="ueber-uns.html">Manufaktur</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div></header>
</noscript>
</div>

<main>
  <section class="section" style="padding-top:clamp(2rem,4vw,3.5rem)" id="pdp-root"></section>

  <section class="section" style="background:var(--paper-2)" id="related-section" hidden>
    <div class="wrap">
      <div class="section-head">
        <div>
          <span class="eyebrow" data-i18n="pdp.related.eyebrow">Passt dazu</span>
          <h2 data-i18n="pdp.related.title">Ebenfalls sehenswert</h2>
        </div>
        <a class="link-underline" href="kollektion.html" data-i18n="pdp.related.link">Alle Entwürfe</a>
      </div>
      <div class="grid grid--3" id="related"></div>
    </div>
  </section>
</main>

<div id="site-footer">
<noscript>
  <footer class="footer"><div class="wrap">
    <p>Möbel, die in Handarbeit entstehen und über Generationen bleiben. Gefertigt in Europa, seit 1974.</p>
    <p>Maximilianstraße 12 · 80539 München · <a href="tel:+498912345678">+49 89 1234 5678</a> ·
       <a href="mailto:salon@maison-noir.de">salon@maison-noir.de</a></p>
    <p class="muted">Warenkorb, Suche und Sprachwahl brauchen JavaScript.</p>
  </div></footer>
</noscript>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
let current, chosenColorIndex = 0, chosenQty = 1;

function initPage() {
  current = findProduct(queryParams().get("id"));

  if (!current) {
    $("#pdp-root").innerHTML = `
      <div class="wrap empty-state">
        <span class="eyebrow">${t("pdp.missing.eyebrow")}</span>
        <h1>${t("pdp.missing.title")}</h1>
        <p class="lede" style="margin-inline:auto">${t("pdp.missing.p")}</p>
        <a class="btn" href="kollektion.html" style="margin-top:1rem">${t("pdp.missing.cta")}</a>
      </div>`;
    return;
  }

  if (!isPreview()) document.title = current.name + " — Maison Noir";
  chosenColorIndex = 0;
  renderPdp();
  renderRelated();
}

function renderPdp() {
  const p = current;
  const x = pt(p);
  const colors = productColors(p);

  $("#pdp-root").innerHTML = `
  <div class="wrap">
    <div class="crumbs">
      <a href="index.html">${t("nav.home")}</a> ·
      <a href="kollektion.html?kategorie=${p.categoryKey}">${t("cat." + p.categoryKey)}</a> · ${p.name}
    </div>

    <div class="pdp">
      <div class="pdp__gallery">
        <div class="pdp__main" id="pdp-main">${artFor(p, chosenColorIndex)}</div>
        <div class="pdp__thumbs" id="pdp-thumbs">
          ${colors.map((c, i) => `
            <button data-index="${i}" class="${i === chosenColorIndex ? "is-active" : ""}"
                    aria-label="${c.name}" title="${c.name}">${artFor(p, i)}</button>`).join("")}
        </div>
      </div>

      <div class="pdp__info">
        <span class="eyebrow">${t("cat." + p.categoryKey)}${x.badge ? " · " + x.badge : ""}</span>
        <h1 style="font-size:clamp(2.2rem,4vw,3.2rem)">${p.name}</h1>
        <div class="price">${euro(p.price)}</div>
        <p class="lede">${x.short}</p>

        <hr class="divider">

        <div class="field">
          <label>${t("pdp.variant")} — <span id="color-name">${colors[chosenColorIndex].name}</span></label>
          <div class="swatches" id="swatches">
            ${colors.map((c, i) => `
              <button class="swatch ${i === chosenColorIndex ? "is-active" : ""}" data-index="${i}"
                      style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join("")}
          </div>
        </div>

        <div class="buy-row" style="margin-top:1.6rem">
          <div class="qty">
            <button id="qty-minus" aria-label="${t("pdp.less")}">−</button>
            <span id="qty-value">1</span>
            <button id="qty-plus" aria-label="${t("pdp.more")}">+</button>
          </div>
          <button class="btn" id="add-to-cart">${t("pdp.add")}</button>
        </div>
        <p class="form-note" style="margin-top:1rem">${t("pdp.note", { lead: x.lead })}</p>

        <hr class="divider">

        <div class="acc">
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="true">${t("pdp.acc.desc")} <i>+</i></button>
            <div class="acc__panel is-open"><p>${x.description}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.spec")} <i>+</i></button>
            <div class="acc__panel">
              <ul class="specs">
                <li><span>${t("pdp.spec.material")}</span><span>${x.material}</span></li>
                <li><span>${t("pdp.spec.dimensions")}</span><span>${x.dimensions}</span></li>
                <li><span>${t("pdp.spec.weight")}</span><span>${p.weight}</span></li>
                <li><span>${t("pdp.spec.origin")}</span><span>${x.origin}</span></li>
              </ul>
            </div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.delivery")} <i>+</i></button>
            <div class="acc__panel"><p>${t("pdp.delivery.body")}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.care")} <i>+</i></button>
            <div class="acc__panel"><p>${t("pdp.care.body")}</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  // Ausführung wählen — über die Farbfelder oder die Ansichten daneben.
  // Beide Wege führen zum selben Ergebnis und färben das Bild um.
  function chooseColor(index) {
    chosenColorIndex = index;
    $("#pdp-main").innerHTML = artFor(current, index);
    $("#color-name").textContent = productColors(current)[index].name;
    $$("#pdp-thumbs button").forEach((b) => b.classList.toggle("is-active", Number(b.dataset.index) === index));
    $$("#swatches .swatch").forEach((s) => s.classList.toggle("is-active", Number(s.dataset.index) === index));
  }

  $$("#pdp-thumbs button").forEach((btn) =>
    btn.addEventListener("click", () => chooseColor(Number(btn.dataset.index))));
  $$("#swatches .swatch").forEach((sw) =>
    sw.addEventListener("click", () => chooseColor(Number(sw.dataset.index))));

  const qtyEl = $("#qty-value");
  $("#qty-minus").addEventListener("click", () => { chosenQty = Math.max(1, chosenQty - 1); qtyEl.textContent = chosenQty; });
  $("#qty-plus").addEventListener("click",  () => { chosenQty = Math.min(99, chosenQty + 1); qtyEl.textContent = chosenQty; });

  $("#add-to-cart").addEventListener("click", () => {
    Cart.add(current.id, chosenQty, chosenColorIndex);
    toast(t("cart.added", { name: current.name + " (" + productColors(current)[chosenColorIndex].name + ")" }));
  });

  initAccordions($("#pdp-root"));
}

function renderRelated() {
  const rest = PRODUCTS.filter((p) => p.id !== current.id);
  const same = rest.filter((p) => p.categoryKey === current.categoryKey);
  const list = [...same, ...rest.filter((p) => p.categoryKey !== current.categoryKey)].slice(0, 3);
  $("#related").innerHTML = list.map(productCard).join("");
  $("#related-section").hidden = false;
  bindAddButtons($("#related"));
  initReveal();
}
</script>
</body>
</html>
