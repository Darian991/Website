<script>
let current, chosenColorIndex = 0, chosenQty = 1, chosenView = 0;

function initPage() {
  current = findProduct(queryParams().get("id"));

  if (!current) {
    $("#pdp-root").innerHTML = `
      <div class="wrap empty-state">
        <span class="eyebrow">${t("pdp.missing.eyebrow")}</span>
        <h1>${t("pdp.missing.title")}</h1>
        <p class="lede" style="margin-inline:auto">${t("pdp.missing.p")}</p>
        <a class="btn" href="kollektion.html" style="margin-top:1rem">${t("pdp.missing.cta")}</a>
      </div>`;
    return;
  }

  setzeProduktKopf(current);
  chosenColorIndex = 0;
  chosenView = 0;
  renderPdp();
  renderRelated();
}

function renderPdp() {
  const p = current;
  const x = pt(p);
  const colors = productColors(p);

  $("#pdp-root").innerHTML = `
  <div class="wrap">
    <div class="crumbs">
      <a href="index.html">${t("nav.home")}</a> ·
      <a href="kollektion.html?kategorie=${p.categoryKey}">${t("cat." + p.categoryKey)}</a> · ${p.name}
    </div>

    <div class="pdp">
      <div class="pdp__gallery">
        <div class="gallery" id="gallery" role="group" aria-roledescription="carousel" aria-label="${t("gallery.label")}">
          <div class="pdp__main" id="pdp-main">${artFor(p, chosenColorIndex, chosenView, true)}</div>
          ${ansichten(p).length > 1 ? `
          <button class="gallery__arrow gallery__arrow--prev" id="gal-prev" aria-label="${t("gallery.prev")}" aria-controls="pdp-main">‹</button>
          <button class="gallery__arrow gallery__arrow--next" id="gal-next" aria-label="${t("gallery.next")}" aria-controls="pdp-main">›</button>
          <span class="gallery__count" id="gal-count" aria-live="polite"></span>` : ""}
        </div>
        ${ansichten(p).length > 1 ? `
        <div class="pdp__thumbs" id="pdp-thumbs">
          ${ansichten(p).map((v, i) => `
            <button data-view="${i}" class="${i === chosenView ? "is-active" : ""}"
                    aria-label="${v.label}" title="${v.label}"
                    >${artFor(p, chosenColorIndex, i)}</button>`).join("")}
        </div>` : ""}
      </div>

      <div class="pdp__info">
        <span class="eyebrow">${t("cat." + p.categoryKey)} · ${p.used ? t("cond.used") : (x.badge || t("cond.new"))}</span>
        <h1 style="font-size:clamp(2.2rem,4vw,3.2rem)">${p.name}</h1>
        <div class="price">${euro(p.price)}</div>
        <p class="lede">${x.short}</p>

        <hr class="divider">

        <div class="field">
          <label>${t("pdp.variant")} — <span id="color-name">${colors[chosenColorIndex].name}</span></label>
          <div class="swatches" id="swatches">
            ${colors.map((c, i) => `
              <button class="swatch ${i === chosenColorIndex ? "is-active" : ""}" data-index="${i}"
                      style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join("")}
          </div>
        </div>

        <div class="buy-row" style="margin-top:1.6rem">
          ${bestand(p) > 1 ? `
          <div class="qty">
            <button id="qty-minus" aria-label="${t("pdp.less")}">−</button>
            <span id="qty-value">1</span>
            <button id="qty-plus" aria-label="${t("pdp.more")}">+</button>
          </div>` : `<span class="claim" style="align-self:center">${t("pdp.unique")}</span>`}
          <button class="btn" id="add-to-cart">${t("pdp.add")}</button>
        </div>
        ${p.used && bestand(p) > 1 ? `<p class="claim" style="margin-top:.9rem">${t("pdp.multi", { n: bestand(p) })}</p>` : ""}
        <p class="form-note" style="margin-top:1rem">${p.used ? t("pdp.note.used") : t("pdp.note", { lead: x.lead })}</p>

        <hr class="divider">

        <div class="acc">
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="true">${t("pdp.acc.desc")} <i>+</i></button>
            <div class="acc__panel is-open"><p>${x.description}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.spec")} <i>+</i></button>
            <div class="acc__panel">
              <ul class="specs">
                ${p.used ? `
                <li><span>${t("pdp.spec.condition")}</span><span>${t("grade." + p.grade)}</span></li>
                <li><span>${t("pdp.spec.year")}</span><span>${p.year}</span></li>` : ""}
                <li><span>${t("pdp.spec.material")}</span><span>${x.material}</span></li>
                <li><span>${t("pdp.spec.dimensions")}</span><span>${x.dimensions}</span></li>
                <li><span>${t("pdp.spec.weight")}</span><span>${p.weight}</span></li>
                <li><span>${t("pdp.spec.origin")}</span><span>${x.origin}</span></li>
              </ul>
            </div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.delivery")} <i>+</i></button>
            <div class="acc__panel"><p>${t("pdp.delivery.body")}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${p.used ? t("pdp.care.title.used") : t("pdp.acc.care")} <i>+</i></button>
            <div class="acc__panel"><p>${p.used ? t("pdp.care.used") : t("pdp.care.body")}</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  /* Galerie: vier Ansichten desselben Stücks, immer in der gewählten
     Ausführung. Bedienbar über die kleinen Bilder, die Pfeile und die
     Pfeiltasten der Tastatur. */
  function zeigeAnsicht(index) {
    const anzahl = ansichten(current).length;
    chosenView = (index + anzahl) % anzahl;
    $("#pdp-main").innerHTML = artFor(current, chosenColorIndex, chosenView, true);
    $$("#pdp-thumbs button").forEach((b) =>
      b.classList.toggle("is-active", Number(b.dataset.view) === chosenView));
    // Bei einer einzigen Aufnahme gibt es weder Zähler noch Pfeile
    const zaehler = $("#gal-count");
    if (zaehler) zaehler.textContent = t("gallery.count", { n: chosenView + 1, m: anzahl });
  }

  function chooseColor(index) {
    chosenColorIndex = index;
    $("#color-name").textContent = productColors(current)[index].name;
    $$("#swatches .swatch").forEach((s) => s.classList.toggle("is-active", Number(s.dataset.index) === index));
    // Alle Bilder der Galerie in der neuen Ausführung neu zeichnen
    $$("#pdp-thumbs button").forEach((b) => {
      b.innerHTML = artFor(current, index, Number(b.dataset.view));
    });
    zeigeAnsicht(chosenView);
  }

  $$("#pdp-thumbs button").forEach((btn) =>
    btn.addEventListener("click", () => zeigeAnsicht(Number(btn.dataset.view))));
  $$("#swatches .swatch").forEach((sw) =>
    sw.addEventListener("click", () => chooseColor(Number(sw.dataset.index))));

  $("#gal-prev")?.addEventListener("click", () => zeigeAnsicht(chosenView - 1));
  $("#gal-next")?.addEventListener("click", () => zeigeAnsicht(chosenView + 1));
  if (ansichten(current).length > 1) {
    $("#gallery").addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); zeigeAnsicht(chosenView - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); zeigeAnsicht(chosenView + 1); }
    });
  }

  zeigeAnsicht(chosenView);

  // Bei Einzelstücken gibt es keine Mengenauswahl
  const qtyEl = $("#qty-value");
  if (qtyEl) {
    const max = bestand(current);
    $("#qty-minus").addEventListener("click", () => { chosenQty = Math.max(1, chosenQty - 1); qtyEl.textContent = chosenQty; });
    $("#qty-plus").addEventListener("click",  () => { chosenQty = Math.min(max, chosenQty + 1); qtyEl.textContent = chosenQty; });
  } else {
    chosenQty = 1;
  }

  $("#add-to-cart").addEventListener("click", () => {
    Cart.add(current.id, chosenQty, chosenColorIndex);
    toast(t("cart.added", { name: current.name + " (" + productColors(current)[chosenColorIndex].name + ")" }));
  });

  initAccordions($("#pdp-root"));
}

function renderRelated() {
  /* Nur Stücke derselben Rubrik, und erst ab zweien. Vorher wurde mit allem
     aufgefüllt, was der Laden sonst führt: Unter einem Stuhl standen Bilder
     von Lampe und Bett, die leicht für weitere Aufnahmen des Stuhls gehalten
     werden. Ein einzelner Nachbar lohnt den Abschnitt nicht — dann führt der
     Weg über die Kollektion. Wächst eine Rubrik, kommt er von selbst zurück. */
  const list = PRODUCTS
    .filter((p) => p.id !== current.id && p.categoryKey === current.categoryKey)
    .slice(0, 3);
  if (list.length < 2) { $("#related-section").hidden = true; return; }
  $("#related").innerHTML = list.map(productCard).join("");
  $("#related-section").hidden = false;
  bindAddButtons($("#related"));
  initReveal();
}
</script>
