<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.home">Maison Noir — Luxusmöbel aus europäischer Handarbeit</title>
<meta name="description" content="Maison Noir fertigt Luxusmöbel in Handarbeit: Sofas, Sessel, Tische und Leuchten aus den besten Materialien Europas. Persönliche Beratung und Lieferung bis in den Raum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
<div id="site-header"></div>

<main>
  <section class="hero">
    <div class="hero__bg" id="hero-art"></div>
    <div class="wrap hero__content">
      <span class="eyebrow" data-i18n="home.hero.eyebrow"></span>
      <h1 data-i18n-html="home.hero.title"></h1>
      <p class="lede" data-i18n="home.hero.lede"></p>
      <div class="hero__actions">
        <a class="btn btn--light" href="kollektion.html" data-i18n="home.hero.cta1"></a>
        <a class="btn btn--light" href="kontakt.html" data-i18n="home.hero.cta2"></a>
      </div>
    </div>
  </section>

  <div class="features">
    <div class="feature"><h4 data-i18n="home.feat1.t"></h4><p data-i18n="home.feat1.p"></p></div>
    <div class="feature"><h4 data-i18n="home.feat2.t"></h4><p data-i18n="home.feat2.p"></p></div>
    <div class="feature"><h4 data-i18n="home.feat3.t"></h4><p data-i18n="home.feat3.p"></p></div>
    <div class="feature"><h4 data-i18n="home.feat4.t"></h4><p data-i18n="home.feat4.p"></p></div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow" data-i18n="home.featured.eyebrow"></span>
          <h2 data-i18n="home.featured.title"></h2>
        </div>
        <a class="link-underline" href="kollektion.html" data-i18n="home.featured.link"></a>
      </div>
      <div class="grid grid--3" id="featured"></div>
    </div>
  </section>

  <section class="split">
    <div class="split__media" id="story-art"></div>
    <div class="split__text split--dark">
      <span class="eyebrow" data-i18n="home.story.eyebrow"></span>
      <h2 data-i18n="home.story.title"></h2>
      <p data-i18n="home.story.p1"></p>
      <p data-i18n="home.story.p2"></p>
      <div style="margin-top:1.5rem"><a class="link-underline" href="ueber-uns.html" data-i18n="home.story.link"></a></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow" data-i18n="home.cats.eyebrow"></span>
          <h2 data-i18n="home.cats.title"></h2>
        </div>
      </div>
      <div class="grid grid--3" id="cats"></div>
    </div>
  </section>

  <section class="section" style="background:var(--paper-2)">
    <div class="wrap center">
      <blockquote class="quote reveal">
        <span data-i18n="home.quote"></span>
        <cite data-i18n="home.quote.cite"></cite>
      </blockquote>
    </div>
  </section>

  <section class="split">
    <div class="split__text">
      <span class="eyebrow" data-i18n="home.service.eyebrow"></span>
      <h2 data-i18n="home.service.title"></h2>
      <p data-i18n="home.service.p"></p>
      <ul class="specs" style="margin:1.5rem 0 2rem">
        <li><span data-i18n="home.service.r1"></span><span data-i18n="home.service.v1"></span></li>
        <li><span data-i18n="home.service.r2"></span><span data-i18n="home.service.v2"></span></li>
        <li><span data-i18n="home.service.r3"></span><span data-i18n="home.service.v3"></span></li>
      </ul>
      <div><a class="btn" href="kontakt.html" data-i18n="home.service.cta"></a></div>
    </div>
    <div class="split__media" id="service-art"></div>
  </section>

  <section class="section newsletter">
    <div class="wrap center">
      <span class="eyebrow" data-i18n="home.news.eyebrow"></span>
      <h2 data-i18n="home.news.title"></h2>
      <p class="lede" style="margin-inline:auto;color:rgba(250,247,242,.75)" data-i18n="home.news.lede"></p>
      <form data-demo>
        <input type="email" name="email" required data-i18n-placeholder="home.news.placeholder" data-i18n-aria="home.news.placeholder">
        <button class="btn btn--light" type="submit" data-i18n="home.news.cta"></button>
        <div class="form-msg" data-msg hidden style="flex:1 1 100%;border-color:rgba(250,247,242,.4);background:rgba(250,247,242,.08)"></div>
      </form>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
function initPage() {
  $("#hero-art").innerHTML    = heroScene();
  $("#story-art").innerHTML   = ART.regal(TONES.clay);
  $("#service-art").innerHTML = ART.tisch(TONES.sage);

  const featured = ["sofa-milano", "sessel-orsini", "tisch-atelier", "lampe-soleil", "sideboard-linea", "bett-sereno"]
    .map(findProduct).filter(Boolean);
  $("#featured").innerHTML = featured.map(productCard).join("");

  const tiles = [
    { label: t("home.cats.sitting"), cat: "sofas",        shape: "sofa",      tone: "sand" },
    { label: t("cat.tische"),        cat: "tische",       shape: "tisch",     tone: "rose" },
    { label: t("cat.aufbewahrung"),  cat: "aufbewahrung", shape: "sideboard", tone: "stone" }
  ];
  $("#cats").innerHTML = tiles.map((tile) => `
    <a class="cat-tile reveal" href="kollektion.html?kategorie=${tile.cat}">
      ${ART[tile.shape](TONES[tile.tone])}
      <span class="cat-tile__label">${tile.label}</span>
    </a>`).join("");
}
</script>
</body>
</html>
