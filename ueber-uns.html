<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.about">Die Manufaktur — Maison Noir</title>
<meta name="description" content="Seit 1974 fertigt Maison Noir Möbel in Handarbeit. Über unsere Werkstätten, Materialien und Menschen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about">
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a> · <span data-i18n="nav.about"></span></div>
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h1 data-i18n-html="about.title"></h1>
      <p class="lede" data-i18n="about.lede"></p>
    </div>
  </section>

  <section class="split">
    <div class="split__media" id="art-1"></div>
    <div class="split__text">
      <span class="eyebrow" data-i18n="about.mat.eyebrow"></span>
      <h2 data-i18n="about.mat.title"></h2>
      <p data-i18n="about.mat.p1"></p>
      <p data-i18n="about.mat.p2"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid grid--3">
        <div class="value reveal">
          <span class="num">52</span>
          <h3 data-i18n="about.n1.t"></h3>
          <p class="muted" data-i18n="about.n1.p"></p>
        </div>
        <div class="value reveal">
          <span class="num">7</span>
          <h3 data-i18n="about.n2.t"></h3>
          <p class="muted" data-i18n="about.n2.p"></p>
        </div>
        <div class="value reveal">
          <span class="num">10</span>
          <h3 data-i18n="about.n3.t"></h3>
          <p class="muted" data-i18n="about.n3.p"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="split">
    <div class="split__text split--dark">
      <span class="eyebrow" data-i18n="about.proc.eyebrow"></span>
      <h2 data-i18n="about.proc.title"></h2>
      <ol style="list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:1.6rem">
        <li><strong style="font-family:var(--serif);font-size:1.3rem">01 — <span data-i18n="about.proc.s1"></span></strong>
          <p style="margin:.35rem 0 0" data-i18n="about.proc.p1"></p></li>
        <li><strong style="font-family:var(--serif);font-size:1.3rem">02 — <span data-i18n="about.proc.s2"></span></strong>
          <p style="margin:.35rem 0 0" data-i18n="about.proc.p2"></p></li>
        <li><strong style="font-family:var(--serif);font-size:1.3rem">03 — <span data-i18n="about.proc.s3"></span></strong>
          <p style="margin:.35rem 0 0" data-i18n="about.proc.p3"></p></li>
        <li><strong style="font-family:var(--serif);font-size:1.3rem">04 — <span data-i18n="about.proc.s4"></span></strong>
          <p style="margin:.35rem 0 0" data-i18n="about.proc.p4"></p></li>
        <li><strong style="font-family:var(--serif);font-size:1.3rem">05 — <span data-i18n="about.proc.s5"></span></strong>
          <p style="margin:.35rem 0 0" data-i18n="about.proc.p5"></p></li>
      </ol>
    </div>
    <div class="split__media" id="art-2"></div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow" data-i18n="about.care.eyebrow"></span>
          <h2 data-i18n="about.care.title"></h2>
        </div>
      </div>
      <div class="acc" style="max-width:820px">
        <div class="acc__item">
          <button class="acc__btn" aria-expanded="true"><span data-i18n="about.care.leather"></span> <i>+</i></button>
          <div class="acc__panel is-open"><p data-i18n="about.care.leather.p"></p></div>
        </div>
        <div class="acc__item">
          <button class="acc__btn" aria-expanded="false"><span data-i18n="about.care.wood"></span> <i>+</i></button>
          <div class="acc__panel"><p data-i18n="about.care.wood.p"></p></div>
        </div>
        <div class="acc__item">
          <button class="acc__btn" aria-expanded="false"><span data-i18n="about.care.fabric"></span> <i>+</i></button>
          <div class="acc__panel"><p data-i18n="about.care.fabric.p"></p></div>
        </div>
        <div class="acc__item">
          <button class="acc__btn" aria-expanded="false"><span data-i18n="about.care.metal"></span> <i>+</i></button>
          <div class="acc__panel"><p data-i18n="about.care.metal.p"></p></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--paper-2)">
    <div class="wrap center">
      <span class="eyebrow" data-i18n="about.visit.eyebrow"></span>
      <h2 data-i18n="about.visit.title"></h2>
      <p class="lede" style="margin-inline:auto" data-i18n-html="about.visit.p"></p>
      <a class="btn" href="kontakt.html" style="margin-top:1rem" data-i18n="about.visit.cta"></a>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
function initPage() {
  $("#art-1").innerHTML = ART.sessel(TONES.clay);
  $("#art-2").innerHTML = ART.sofa(TONES.sand);
}
</script>
</body>
</html>
