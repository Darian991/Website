<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.contact">Kontakt &amp; Beratung — Maison Noir</title>
<meta name="description" content="Persönliche Einrichtungsberatung, Showroom München und Kontakt zu Maison Noir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a> · <span data-i18n="nav.contact"></span></div>
      <h1 data-i18n-html="contact.title"></h1>
      <p class="lede" data-i18n="contact.lede"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid grid--form">

        <form data-demo>
          <h3 data-i18n="contact.form.title"></h3>
          <div class="form-row">
            <div class="field">
              <label for="name" data-i18n="contact.name"></label>
              <input id="name" name="name" type="text" required autocomplete="name">
            </div>
            <div class="field">
              <label for="email" data-i18n="contact.email"></label>
              <input id="email" name="email" type="email" required autocomplete="email">
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="phone" data-i18n="contact.phone"></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div class="field">
              <label for="topic" data-i18n="contact.topic"></label>
              <select id="topic" name="topic">
                <option data-i18n="contact.topic1"></option>
                <option data-i18n="contact.topic2"></option>
                <option data-i18n="contact.topic3"></option>
                <option data-i18n="contact.topic4"></option>
                <option data-i18n="contact.topic5"></option>
                <option data-i18n="contact.topic6"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="message" data-i18n="contact.message"></label>
            <textarea id="message" name="message" required data-i18n-placeholder="contact.messagePlaceholder"></textarea>
          </div>
          <p class="form-note" data-i18n="contact.privacy"></p>
          <button class="btn" type="submit" style="margin-top:1rem" data-i18n="contact.send"></button>
          <div class="form-msg" data-msg hidden style="margin-top:1.2rem"></div>
        </form>

        <aside>
          <h3 data-i18n="contact.reach"></h3>
          <ul class="specs" style="margin-bottom:2.5rem">
            <li><span data-i18n="contact.phoneLabel"></span><a href="tel:+498912345678">+49 89 1234 5678</a></li>
            <li><span data-i18n="contact.emailLabel"></span><a href="mailto:salon@maison-noir.de">salon@maison-noir.de</a></li>
            <li><span data-i18n="contact.hoursLabel"></span><span data-i18n="contact.hours"></span></li>
          </ul>

          <h3 data-i18n="contact.showroom"></h3>
          <p class="muted" data-i18n-html="contact.address"></p>
          <ul class="specs" style="margin-bottom:2.5rem">
            <li><span data-i18n="contact.monfri"></span><span data-i18n="contact.monfriH"></span></li>
            <li><span data-i18n="contact.sat"></span><span data-i18n="contact.satH"></span></li>
            <li><span data-i18n="contact.sun"></span><span data-i18n="contact.sunH"></span></li>
          </ul>

          <div style="border:1px solid var(--line);padding:1.6rem;border-radius:var(--radius);background:var(--card)">
            <span class="eyebrow" data-i18n="contact.hint"></span>
            <p style="margin:0;font-size:.92rem" class="muted" data-i18n="contact.hint.p"></p>
          </div>
        </aside>

      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
function initPage() {
  const topic = queryParams().get("thema");
  if (topic) {
    const sel = $("#topic");
    [...sel.options].forEach((o) => { if (o.text === topic) sel.value = o.value; });
  }
}
</script>
</body>
</html>
