<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Noir Möbelmanufaktur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MAISON NOIR — Luxusmöbel
   Design-System & Layout
   ========================================================= */

:root {
  /* Farben */
  --ink:        #16150f;
  --ink-soft:   #35322a;
  --muted:      #7a7367;
  --line:       #e0d9cd;
  --paper:      #faf7f2;
  --paper-2:    #f2ece2;
  --card:       #ffffff;
  --brass:      #a9863f;
  --brass-deep: #8a6c2d;

  /* Typografie */
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Maße */
  --wrap: 1240px;
  --pad: clamp(1.25rem, 4vw, 3rem);
  --radius: 2px;
  --shadow: 0 1px 2px rgba(22,21,15,.04), 0 12px 40px -18px rgba(22,21,15,.22);
  --t: 420ms cubic-bezier(.2,.7,.2,1);
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -.01em;
  margin: 0 0 .5em;
}
h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }
h2 { font-size: clamp(2rem, 4vw, 3rem); }
h3 { font-size: clamp(1.3rem, 2vw, 1.6rem); }
p  { margin: 0 0 1.1em; }

.wrap { width: min(100% - (2 * var(--pad)), var(--wrap)); margin-inline: auto; }
.section { padding: clamp(4rem, 9vw, 8rem) 0; }
.center { text-align: center; }

.eyebrow {
  font-size: .72rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 500;
  margin-bottom: 1rem;
  display: block;
}
.lede { font-size: 1.08rem; color: var(--ink-soft); max-width: 60ch; }
.muted { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  padding: .95rem 2rem;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  border-radius: var(--radius);
  font-size: .78rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background var(--t), color var(--t), border-color var(--t), transform var(--t);
}
.btn:hover { background: var(--brass-deep); border-color: var(--brass-deep); }
.btn:active { transform: translateY(1px); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn--light { background: transparent; color: var(--paper); border-color: rgba(250,247,242,.55); }
.btn--light:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.link-underline {
  display: inline-block;
  font-size: .78rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  padding-bottom: .35rem;
  border-bottom: 1px solid var(--brass);
  transition: color var(--t), border-color var(--t);
}
.link-underline:hover { color: var(--brass); }

/* ---------- Kopfzeile ---------- */
.topbar {
  background: var(--ink);
  color: rgba(250,247,242,.82);
  font-size: .72rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-align: center;
  padding: .7rem 1rem;
}

.header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(250,247,242,.88);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  min-height: 78px;
}
.logo {
  font-family: var(--serif);
  font-size: 1.5rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  white-space: nowrap;
}
.logo small {
  display: block;
  font-family: var(--sans);
  font-size: .55rem;
  letter-spacing: .38em;
  color: var(--brass);
  margin-top: -.15rem;
}

.nav { display: flex; gap: 2rem; }
.nav a {
  font-size: .76rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  position: relative;
  padding: .3rem 0;
  color: var(--ink-soft);
  transition: color var(--t);
}
.nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 0; height: 1px;
  background: var(--brass);
  transition: width var(--t);
}
.nav a:hover, .nav a.is-active { color: var(--ink); }
.nav a:hover::after, .nav a.is-active::after { width: 100%; }

.header__actions { display: flex; align-items: center; gap: 1.1rem; }
.icon-btn {
  background: none;
  border: 0;
  cursor: pointer;
  padding: .4rem;
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  font-size: .76rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  transition: color var(--t);
}
.icon-btn:hover { color: var(--brass); }
.cart-count {
  min-width: 20px; height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--brass);
  color: #fff;
  font-size: .66rem;
  font-family: var(--sans);
  letter-spacing: 0;
  display: inline-grid;
  place-items: center;
}
.burger { display: none; }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  min-height: clamp(560px, 82vh, 820px);
  display: grid;
  align-items: center;
  background: var(--paper-2);
  overflow: hidden;
}
.hero__bg { position: absolute; inset: 0; }
.hero__bg img, .hero__bg svg { width: 100%; height: 100%; object-fit: cover; }
.hero::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(22,21,15,.72) 0%, rgba(22,21,15,.42) 45%, rgba(22,21,15,.05) 100%);
}
.hero__content { position: relative; z-index: 2; color: var(--paper); max-width: 640px; padding: 4rem 0; }
.hero__content .eyebrow { color: #d9bd82; }
.hero__content p { color: rgba(250,247,242,.85); }
.hero__actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }

/* ---------- Merkmalsleiste ---------- */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  border-block: 1px solid var(--line);
}
.feature { padding: 2.2rem 1.6rem; text-align: center; border-right: 1px solid var(--line); }
.feature:last-child { border-right: 0; }
.feature h4 { font-family: var(--sans); font-size: .76rem; letter-spacing: .16em; text-transform: uppercase; margin-bottom: .4rem; }
.feature p { font-size: .88rem; color: var(--muted); margin: 0; }

/* ---------- Abschnittskopf ---------- */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3rem; flex-wrap: wrap; }
.section-head p { margin: 0; }

/* ---------- Produktraster ---------- */
.grid { display: grid; gap: clamp(1.4rem, 3vw, 2.4rem); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

.card { background: transparent; display: flex; flex-direction: column; }
.card__media {
  position: relative;
  aspect-ratio: 4 / 5;
  background: var(--paper-2);
  overflow: hidden;
  border-radius: var(--radius);
}
.card__media img, .card__media svg { width: 100%; height: 100%; object-fit: cover; transition: transform 900ms cubic-bezier(.2,.7,.2,1); }
.card:hover .card__media img, .card:hover .card__media svg { transform: scale(1.045); }
.card__tag {
  position: absolute; top: 1rem; left: 1rem;
  background: var(--ink); color: var(--paper);
  font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
  padding: .4rem .75rem;
}
.card__quick {
  position: absolute; left: 1rem; right: 1rem; bottom: 1rem;
  opacity: 0; transform: translateY(10px);
  transition: opacity var(--t), transform var(--t);
}
.card:hover .card__quick, .card:focus-within .card__quick { opacity: 1; transform: none; }
.card__body { padding-top: 1.1rem; display: flex; flex-direction: column; gap: .25rem; }
.card__cat { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.card__title { font-family: var(--serif); font-size: 1.35rem; }
.card__price { font-size: .95rem; color: var(--ink-soft); }

/* ---------- Split-Banner ---------- */
.split { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; gap: 0; }
.split__media { min-height: 460px; background: var(--paper-2); }
.split__media img, .split__media svg { width: 100%; height: 100%; object-fit: cover; }
.split__text { padding: clamp(2.5rem, 6vw, 5.5rem); display: flex; flex-direction: column; justify-content: center; }
.split--dark { background: var(--ink); color: var(--paper); }
.split--dark p { color: rgba(250,247,242,.78); }

/* ---------- Kategorien ---------- */
.cat-tile { position: relative; display: block; overflow: hidden; border-radius: var(--radius); aspect-ratio: 3/4; background: var(--paper-2); }
.cat-tile svg, .cat-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 900ms cubic-bezier(.2,.7,.2,1); }
.cat-tile:hover svg, .cat-tile:hover img { transform: scale(1.06); }
.cat-tile__label {
  position: absolute; inset: auto 0 0 0;
  padding: 2.5rem 1.5rem 1.4rem;
  background: linear-gradient(transparent, rgba(22,21,15,.75));
  color: var(--paper);
  font-family: var(--serif);
  font-size: 1.5rem;
  text-align: center;
}

/* ---------- Zitat ---------- */
.quote { max-width: 46ch; margin-inline: auto; font-family: var(--serif); font-size: clamp(1.5rem, 3vw, 2.3rem); line-height: 1.35; }
.quote cite { display: block; font-family: var(--sans); font-style: normal; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 1.8rem; }

/* ---------- Formulare ---------- */
.field { display: flex; flex-direction: column; gap: .45rem; margin-bottom: 1.15rem; }
.field label { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select {
  font: inherit;
  padding: .85rem 1rem;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  color: var(--ink);
  transition: border-color var(--t), box-shadow var(--t);
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--brass);
  box-shadow: 0 0 0 3px rgba(169,134,63,.14);
}
.field textarea { resize: vertical; min-height: 150px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.15rem; }
.form-note { font-size: .8rem; color: var(--muted); }
.form-msg { padding: 1rem 1.2rem; border: 1px solid var(--brass); background: rgba(169,134,63,.08); border-radius: var(--radius); font-size: .9rem; }

/* ---------- Newsletter ---------- */
.newsletter { background: var(--ink); color: var(--paper); }
.newsletter p { color: rgba(250,247,242,.75); }
.newsletter form { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; margin-top: 1.8rem; }
.newsletter input {
  flex: 1 1 320px;
  padding: .95rem 1.2rem;
  background: transparent;
  border: 1px solid rgba(250,247,242,.35);
  color: var(--paper);
  border-radius: var(--radius);
  font: inherit;
}
.newsletter input::placeholder { color: rgba(250,247,242,.45); }
.newsletter input:focus { outline: none; border-color: var(--brass); }

/* ---------- Fußzeile ---------- */
.footer { background: var(--ink); color: rgba(250,247,242,.72); padding: clamp(3.5rem, 7vw, 6rem) 0 2rem; }
.footer a { color: rgba(250,247,242,.72); transition: color var(--t); }
.footer a:hover { color: var(--brass); }
.footer__grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 2.5rem; }
.footer .logo { color: var(--paper); }
.footer h5 { font-family: var(--sans); font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--paper); margin: 0 0 1.1rem; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; font-size: .92rem; }
.footer__bottom {
  margin-top: 3.5rem; padding-top: 1.6rem;
  border-top: 1px solid rgba(250,247,242,.14);
  display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  font-size: .8rem;
}

/* ---------- Seitenkopf ---------- */
.page-head { padding: clamp(3rem, 7vw, 5.5rem) 0 clamp(2rem, 4vw, 3rem); border-bottom: 1px solid var(--line); }
.crumbs { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
.crumbs a:hover { color: var(--brass); }

/* ---------- Filter ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line);
  background: transparent;
  padding: .55rem 1.15rem;
  border-radius: 999px;
  font-size: .74rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--t);
}
.chip:hover { border-color: var(--ink); }
.chip.is-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sort { display: flex; align-items: center; gap: .6rem; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sort select { border: 1px solid var(--line); background: var(--card); padding: .55rem .8rem; border-radius: var(--radius); font-size: .78rem; }

/* ---------- Produktdetail ---------- */
.pdp { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.pdp__gallery { display: grid; gap: 1rem; }
.pdp__main { aspect-ratio: 1/1; background: var(--paper-2); border-radius: var(--radius); overflow: hidden; }
.pdp__main svg, .pdp__main img { width: 100%; height: 100%; object-fit: cover; }
.pdp__thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.pdp__thumbs button { border: 1px solid var(--line); background: var(--paper-2); padding: 0; border-radius: var(--radius); overflow: hidden; cursor: pointer; aspect-ratio: 1/1; transition: border-color var(--t); }
.pdp__thumbs button.is-active, .pdp__thumbs button:hover { border-color: var(--brass); }
.pdp__info { position: sticky; top: 110px; }
.price { font-family: var(--serif); font-size: 2rem; margin: .4rem 0 1.2rem; }
.divider { height: 1px; background: var(--line); margin: 2rem 0; border: 0; }

.swatches { display: flex; gap: .7rem; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; transition: box-shadow var(--t); }
.swatch.is-active { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--brass); }

.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.qty button { width: 44px; height: 46px; background: none; border: 0; cursor: pointer; font-size: 1.1rem; transition: color var(--t); }
.qty button:hover { color: var(--brass); }
.qty span { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.buy-row { display: flex; gap: .9rem; flex-wrap: wrap; align-items: center; }
.buy-row .btn { flex: 1 1 220px; }

.specs { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; font-size: .92rem; }
.specs li { display: flex; justify-content: space-between; gap: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: .75rem; }
.specs span:first-child { color: var(--muted); }

.acc { border-top: 1px solid var(--line); }
.acc__item { border-bottom: 1px solid var(--line); }
.acc__btn { width: 100%; background: none; border: 0; text-align: left; padding: 1.15rem 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
.acc__btn i { font-style: normal; color: var(--brass); transition: transform var(--t); }
.acc__btn[aria-expanded="true"] i { transform: rotate(45deg); }
.acc__panel { display: none; padding-bottom: 1.4rem; font-size: .92rem; color: var(--ink-soft); }
.acc__panel.is-open { display: block; }

/* ---------- Warenkorb ---------- */
.cart-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.cart-item { display: grid; grid-template-columns: 110px 1fr auto; gap: 1.4rem; padding: 1.5rem 0; border-bottom: 1px solid var(--line); align-items: center; }
.cart-item__media { aspect-ratio: 1/1; background: var(--paper-2); border-radius: var(--radius); overflow: hidden; }
.cart-item__media svg { width: 100%; height: 100%; object-fit: cover; }
.cart-item__title { font-family: var(--serif); font-size: 1.2rem; }
.cart-item__meta { font-size: .8rem; color: var(--muted); }
.cart-item__remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; padding: 0; margin-top: .5rem; transition: color var(--t); }
.cart-item__remove:hover { color: #a33; }
.cart-item__price { font-variant-numeric: tabular-nums; white-space: nowrap; }

.summary { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(1.5rem, 3vw, 2.2rem); position: sticky; top: 110px; }
.summary__row { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; font-size: .95rem; }
.summary__row--total { border-top: 1px solid var(--line); margin-top: .8rem; padding-top: 1.1rem; font-family: var(--serif); font-size: 1.5rem; }
.empty-state { text-align: center; padding: clamp(3rem, 8vw, 6rem) 1rem; }

/* ---------- Warenkorb-Schublade ---------- */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(22,21,15,.42);
  opacity: 0; pointer-events: none; transition: opacity var(--t); z-index: 90;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%;
  width: min(420px, 100%);
  background: var(--paper);
  z-index: 100;
  transform: translateX(100%);
  transition: transform var(--t);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow);
}
.drawer.is-open { transform: none; }
.drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 1.4rem var(--pad); border-bottom: 1px solid var(--line); }
.drawer__head h3 { margin: 0; font-size: 1.3rem; }
.drawer__body { flex: 1; overflow-y: auto; padding: 0 var(--pad); }
.drawer__foot { padding: 1.4rem var(--pad); border-top: 1px solid var(--line); display: grid; gap: .8rem; }
.close-x { background: none; border: 0; font-size: 1.4rem; cursor: pointer; line-height: 1; padding: .2rem .4rem; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%;
  transform: translate(-50%, 200%);
  opacity: 0;
  visibility: hidden;
  background: var(--ink); color: var(--paper);
  padding: .9rem 1.6rem; border-radius: var(--radius);
  font-size: .82rem; letter-spacing: .1em;
  z-index: 120; transition: transform var(--t), opacity var(--t), visibility var(--t);
  box-shadow: var(--shadow);
}
.toast.is-open { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* ---------- Team / Werte ---------- */
.value { padding: 2rem 0; border-top: 1px solid var(--line); }
.value h3 { margin-bottom: .4rem; }
.value .num { font-family: var(--serif); font-size: 2.6rem; color: var(--brass); line-height: 1; display: block; margin-bottom: .6rem; }

/* ---------- Animation beim Scrollen ---------- */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 800ms ease, transform 800ms cubic-bezier(.2,.7,.2,1); }
.reveal.is-visible { opacity: 1; transform: none; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .split { grid-template-columns: 1fr; }
  .split__media { min-height: 340px; }
  .pdp { grid-template-columns: 1fr; }
  .pdp__info { position: static; }
  .cart-layout { grid-template-columns: 1fr; }
  .summary { position: static; }
  .footer__grid { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 760px) {
  .burger { display: inline-flex; }
  .nav {
    position: fixed; inset: 0 0 0 auto;
    width: min(320px, 100%);
    background: var(--paper);
    flex-direction: column;
    gap: 0;
    padding: 6rem var(--pad) 2rem;
    transform: translateX(100%);
    transition: transform var(--t);
    z-index: 95;
    border-left: 1px solid var(--line);
  }
  .nav.is-open { transform: none; }
  .nav a { padding: 1.1rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .nav a::after { display: none; }
  .icon-btn span.label { display: none; }
  .header__actions a.icon-btn { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .footer__grid { grid-template-columns: 1fr; }
  .cart-item { grid-template-columns: 84px 1fr; }

  const order = [product.tone, "stone", "ink"];

<script>
document.body.dataset.spa = "true";
/* =========================================================
   MAISON NOIR — Anwendungslogik
   Kopf-/Fußzeile, Warenkorb, Filter, Produktdetail
   ========================================================= */

/* ---------- Hilfsfunktionen ---------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const euro = (n) =>
  new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);

const findProduct = (id) => PRODUCTS.find((p) => p.id === id);


/* ---------- Adressparameter ----------
   Funktioniert sowohl in der normalen Website (?id=…) als auch in der
   Einzeldatei-Vorschau, die stattdessen die Raute nutzt (#produkt.html?id=…). */
function isPreview() { return document.body.dataset.spa === "true"; }

function queryParams() {
  const hash = location.hash.replace(/^#/, "");
  const q = hash.indexOf("?");
  if (q > -1) return new URLSearchParams(hash.slice(q + 1));
  return new URLSearchParams(location.search);
}

function setParam(key, value) {
  if (isPreview()) {
    const hash = location.hash.replace(/^#/, "") || "index.html";
    const [path, search] = hash.split("?");
    const params = new URLSearchParams(search || "");
    if (value === null) params.delete(key); else params.set(key, value);
    const str = params.toString();
    history.replaceState(null, "", "#" + path + (str ? "?" + str : ""));
  } else {
    const url = new URL(location.href);
    if (value === null) url.searchParams.delete(key); else url.searchParams.set(key, value);
    history.replaceState(null, "", url);
  }
}

/* Zuhörer, die beim Seitenwechsel wieder abgemeldet werden müssen */
const pageListeners = [];
function onCartChange(fn) {
  document.addEventListener("cart:changed", fn);
  pageListeners.push(fn);
}
function clearPageListeners() {
  pageListeners.splice(0).forEach((fn) => document.removeEventListener("cart:changed", fn));
}

/* ---------- Warenkorb (im Browser gespeichert) ---------- */
const CART_KEY = "maison-noir-cart";

const Cart = {
  read() {
    try {
      const raw = localStorage.getItem(CART_KEY);
      const items = raw ? JSON.parse(raw) : [];
      return Array.isArray(items) ? items.filter((i) => findProduct(i.id)) : [];
    } catch (e) {
      return [];
    }
  },
  write(items) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(items)); } catch (e) { /* z. B. privater Modus */ }
    document.dispatchEvent(new CustomEvent("cart:changed", { detail: items }));
  },
  add(id, qty = 1, color = null) {
    const items = Cart.read();
    const key = (i) => i.id === id && i.color === color;
    const existing = items.find(key);
    if (existing) existing.qty += qty;
    else items.push({ id, qty, color });
    Cart.write(items);
  },
  setQty(index, qty) {
    const items = Cart.read();
    if (!items[index]) return;
    if (qty <= 0) items.splice(index, 1);
    else items[index].qty = Math.min(qty, 99);
    Cart.write(items);
  },
  remove(index) {
    const items = Cart.read();
    items.splice(index, 1);
    Cart.write(items);
  },
  clear() { Cart.write([]); },
  count() { return Cart.read().reduce((s, i) => s + i.qty, 0); },
  subtotal() {
    return Cart.read().reduce((s, i) => {
      const p = findProduct(i.id);
      return p ? s + p.price * i.qty : s;
    }, 0);
  }
};

/* ---------- Kopf- und Fußzeile ---------- */
const NAV = [
  { href: "index.html",     label: "Startseite", key: "home" },
  { href: "kollektion.html", label: "Kollektion", key: "shop" },
  { href: "ueber-uns.html",  label: "Manufaktur", key: "about" },
  { href: "kontakt.html",    label: "Kontakt",    key: "contact" }
];

function renderChrome() {
  const page = document.body.dataset.page || "";

  const header = `
  <div class="topbar">Versandkostenfrei innerhalb Europas · Persönliche Beratung unter +49 89 1234 5678</div>
  <header class="header">
    <div class="wrap header__inner">
      <a class="logo" href="index.html">Maison Noir<small>Möbelmanufaktur</small></a>
      <nav class="nav" id="nav">
        ${NAV.map((n) => `<a href="${n.href}" class="${n.key === page ? "is-active" : ""}">${n.label}</a>`).join("")}
      </nav>
      <div class="header__actions">
        <button class="icon-btn burger" id="burger" aria-label="Menü öffnen" aria-expanded="false">☰</button>
        <a class="icon-btn" href="kontakt.html" aria-label="Beratung"><span class="label">Beratung</span></a>
        <button class="icon-btn" id="cart-open" aria-label="Warenkorb öffnen">
          <span class="label">Warenkorb</span><span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>`;

  const footer = `
  <footer class="footer">
    <div class="wrap">
      <div class="footer__grid">
        <div>
          <a class="logo" href="index.html">Maison Noir<small>Möbelmanufaktur</small></a>
          <p style="margin-top:1.2rem;max-width:34ch;font-size:.92rem">
            Möbel, die in Handarbeit entstehen und über Generationen bleiben.
            Gefertigt in Europa, seit 1974.
          </p>
        </div>
        <div>
          <h5>Kollektion</h5>
          <ul>
            <li><a href="kollektion.html?kategorie=Sofas">Sofas</a></li>
            <li><a href="kollektion.html?kategorie=Sessel">Sessel</a></li>
            <li><a href="kollektion.html?kategorie=Tische">Tische</a></li>
            <li><a href="kollektion.html?kategorie=Leuchten">Leuchten</a></li>
            <li><a href="kollektion.html">Alles ansehen</a></li>
          </ul>
        </div>
        <div>
          <h5>Service</h5>
          <ul>
            <li><a href="kontakt.html">Persönliche Beratung</a></li>
            <li><a href="kontakt.html">Lieferung &amp; Montage</a></li>
            <li><a href="ueber-uns.html">Pflegehinweise</a></li>
            <li><a href="ueber-uns.html">Manufaktur</a></li>
          </ul>
        </div>
        <div>
          <h5>Showroom</h5>
          <ul>
            <li>Maximilianstraße 12</li>
            <li>80539 München</li>
            <li><a href="tel:+498912345678">+49 89 1234 5678</a></li>
            <li><a href="mailto:salon@maison-noir.de">salon@maison-noir.de</a></li>
          </ul>
        </div>
      </div>
      <div class="footer__bottom">
        <span>© ${new Date().getFullYear()} Maison Noir Möbelmanufaktur</span>
        <span>Impressum · Datenschutz · AGB · Widerrufsrecht</span>
      </div>
    </div>
  </footer>`;

  const drawer = `
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Warenkorb">
    <div class="drawer__head">
      <h3>Warenkorb</h3>
      <button class="close-x" id="drawer-close" aria-label="Schließen">×</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
    <div class="drawer__foot">
      <div class="summary__row"><span>Zwischensumme</span><strong id="drawer-total">0 €</strong></div>
      <a class="btn btn--block" href="warenkorb.html">Zur Kasse</a>
      <button class="btn btn--ghost btn--block" id="drawer-continue">Weiter stöbern</button>
    </div>
  </aside>
  <div class="toast" id="toast"></div>`;

  const hostTop = $("#site-header");
  const hostBottom = $("#site-footer");
  if (hostTop) hostTop.innerHTML = header;
  if (hostBottom) hostBottom.innerHTML = footer + drawer;

  bindChrome();
}

function bindChrome() {
  const burger = $("#burger");
  const nav = $("#nav");
  if (burger && nav) {
    burger.addEventListener("click", () => {
      const open = nav.classList.toggle("is-open");
      burger.setAttribute("aria-expanded", String(open));
      burger.textContent = open ? "×" : "☰";
    });
  }

  const backdrop = $("#drawer-backdrop");
  const drawer = $("#drawer");
  const openDrawer = () => {
    drawer.classList.add("is-open");
    backdrop.classList.add("is-open");
    drawer.setAttribute("aria-hidden", "false");
    renderDrawer();
    $("#drawer-close")?.focus();
  };
  const closeDrawer = () => {
    if (!drawer.classList.contains("is-open")) return;
    drawer.classList.remove("is-open");
    backdrop.classList.remove("is-open");
    drawer.setAttribute("aria-hidden", "true");
    $("#cart-open")?.focus();
  };

  $("#cart-open")?.addEventListener("click", openDrawer);
  $("#drawer-close")?.addEventListener("click", closeDrawer);
  $("#drawer-continue")?.addEventListener("click", closeDrawer);
  backdrop?.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  document.addEventListener("route:changed", closeDrawer);

  updateCartCount();
  document.addEventListener("cart:changed", () => { updateCartCount(); renderDrawer(); });
}

function updateCartCount() {
  const el = $("#cart-count");
  if (el) el.textContent = Cart.count();
}

function renderDrawer() {
  const body = $("#drawer-body");
  if (!body) return;
  const items = Cart.read();

  if (!items.length) {
    body.innerHTML = `<p class="muted" style="padding:2.5rem 0;text-align:center">Ihr Warenkorb ist noch leer.</p>`;
  } else {
    body.innerHTML = items.map((item, index) => {
      const p = findProduct(item.id);
      return `
      <div class="cart-item" style="grid-template-columns:72px 1fr">
        <div class="cart-item__media">${artFor(p)}</div>
        <div>
          <div class="cart-item__title">${p.name}</div>
          <div class="cart-item__meta">${item.color || p.colors[0].name} · ${item.qty} × ${euro(p.price)}</div>
          <button class="cart-item__remove" data-remove="${index}">Entfernen</button>
        </div>
      </div>`;
    }).join("");
    $$("[data-remove]", body).forEach((btn) =>
      btn.addEventListener("click", () => Cart.remove(Number(btn.dataset.remove)))
    );
  }
  const total = $("#drawer-total");
  if (total) total.textContent = euro(Cart.subtotal());
}

/* ---------- Hinweis-Einblendung ---------- */
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("is-open");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-open"), 2600);
}

/* ---------- Produktkarte ---------- */
function productCard(p) {
  return `
  <article class="card reveal">
    <a class="card__media" href="produkt.html?id=${p.id}" aria-label="${p.name} ansehen">
      ${artFor(p)}
      ${p.badge ? `<span class="card__tag">${p.badge}</span>` : ""}
      <div class="card__quick">
        <button class="btn btn--block" data-add="${p.id}">In den Warenkorb</button>
      </div>
    </a>
    <div class="card__body">
      <span class="card__cat">${p.category}</span>
      <a class="card__title" href="produkt.html?id=${p.id}">${p.name}</a>
      <span class="card__price">${euro(p.price)}</span>
    </div>
  </article>`;
}

/* Verhindert, dass ein Element seine Klick-Funktion doppelt erhält */
function once(el, mark) {
  if (el.dataset[mark] === "1") return false;
  el.dataset[mark] = "1";
  return true;
}

function bindAddButtons(root = document) {
  $$("[data-add]", root).forEach((btn) => {
    if (!once(btn, "boundAdd")) return;
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const p = findProduct(btn.dataset.add);
      Cart.add(p.id, 1, p.colors[0].name);
      toast(`${p.name} wurde in den Warenkorb gelegt`);
    });
  });
}

/* ---------- Einblenden beim Scrollen ---------- */
function initReveal() {
  const items = $$(".reveal");
  if (!("IntersectionObserver" in window)) {
    items.forEach((el) => el.classList.add("is-visible"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add("is-visible"), Math.min(i * 70, 350));
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -60px" });
  items.forEach((el) => io.observe(el));
}

/* ---------- Ziehharmonika (Produktdetail) ---------- */
function initAccordions(root = document) {
  $$(".acc__btn", root).forEach((btn) => {
    if (!once(btn, "boundAcc")) return;
    btn.addEventListener("click", () => {
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      btn.nextElementSibling.classList.toggle("is-open", !open);
    });
  });
}

/* ---------- Formulare (Demo ohne Server) ---------- */
function initForms() {
  $$("form[data-demo]").forEach((form) => {
    if (!once(form, "boundForm")) return;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const box = form.querySelector("[data-msg]");
      const name = form.querySelector("[name=name]")?.value?.trim();
      if (box) {
        box.hidden = false;
        box.textContent = name
          ? `Vielen Dank, ${name}. Wir melden uns innerhalb eines Werktages bei Ihnen.`
          : "Vielen Dank — wir haben Ihre Anfrage erhalten.";
      }
      form.reset();
    });
  });
}

/* ---------- Start ---------- */
document.addEventListener("DOMContentLoaded", () => {
  renderChrome();
  if (typeof initPage === "function") initPage();
  bindAddButtons();
  initAccordions();
  initForms();
  initReveal();
});

</script>

  "kollektion.html": {

    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\">Startseite</a> · Kollektion</div>\n      <h1>Die Kollektion</h1>\n      <p class=\"lede\">Vierzehn Entwürfe, die wir dauerhaft fertigen. Jedes Stück wird nach Ihrer Bestellung\n      begonnen — in der Ausführung, die Sie wählen.</p>\n    </div>\n  </section>\n\n  <section class=\"section\" style=\"padding-top:clamp(2.5rem,5vw,4rem)\">\n    <div class=\"wrap\">\n      <div class=\"toolbar\">\n        <div class=\"filters\" id=\"filters\"></div>\n        <div class=\"sort\">\n          <label for=\"sort\">Sortieren</label>\n          <select id=\"sort\">\n            <option value=\"empfohlen\">Empfohlen</option>\n            <option value=\"preis-auf\">Preis aufsteigend</option>\n            <option value=\"preis-ab\">Preis absteigend</option>\n            <option value=\"name\">Name A–Z</option>\n          </select>\n        </div>\n      </div>\n\n      <p class=\"muted\" id=\"result-count\" style=\"font-size:.85rem;letter-spacing:.1em;text-transform:uppercase\"></p>\n      <div class=\"grid grid--3\" id=\"products\" style=\"margin-top:1.5rem\"></div>\n    </div>\n  </section>",
    init: function () {
let activeCat = "Alle";

function initPage() {
  const wanted = queryParams().get("kategorie");
  if (wanted && CATEGORIES.includes(wanted)) activeCat = wanted;

  $("#filters").innerHTML = CATEGORIES.map((c) =>
    `<button class="chip ${c === activeCat ? "is-active" : ""}" data-cat="${c}">${c}</button>`).join("");

  $$("#filters .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      activeCat = chip.dataset.cat;
      $$("#filters .chip").forEach((c) => c.classList.toggle("is-active", c === chip));
      setParam("kategorie", activeCat === "Alle" ? null : activeCat);
      renderList();
    });
  });

  $("#sort").addEventListener("change", renderList);
  renderList();
}

function renderList() {
  let list = activeCat === "Alle" ? [...PRODUCTS] : PRODUCTS.filter((p) => p.category === activeCat);

  switch ($("#sort").value) {
    case "preis-auf": list.sort((a, b) => a.price - b.price); break;
    case "preis-ab":  list.sort((a, b) => b.price - a.price); break;
    case "name":      list.sort((a, b) => a.name.localeCompare(b.name, "de")); break;
  }

  $("#result-count").textContent =
    `${list.length} ${list.length === 1 ? "Entwurf" : "Entwürfe"}${activeCat !== "Alle" ? " · " + activeCat : ""}`;

  const grid = $("#products");
  grid.innerHTML = list.length
    ? list.map(productCard).join("")
    : `<p class="muted">In dieser Kategorie ist derzeit nichts verfügbar.</p>`;

  bindAddButtons(grid);
  initReveal();
}
      initPage();
    }
  },
  "produkt.html": {
    page: "shop",
    html: "<section class=\"section\" style=\"padding-top:clamp(2rem,4vw,3.5rem)\" id=\"pdp-root\"></section>\n\n  <section class=\"section\" style=\"background:var(--paper-2)\" id=\"related-section\" hidden>\n    <div class=\"wrap\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\">Passt dazu</span>\n          <h2>Ebenfalls sehenswert</h2>\n        </div>\n        <a class=\"link-underline\" href=\"kollektion.html\">Alle Entwürfe</a>\n      </div>\n      <div class=\"grid grid--3\" id=\"related\"></div>\n    </div>\n  </section>",
    init: function () {

        <hr class="divider">

        <div class="acc">
          <div class="acc__item">

                <li><span>Maße</span><span>${p.dimensions}</span></li>
                <li><span>Gewicht</span><span>${p.weight}</span></li>
                <li><span>Fertigung</span><span>${p.origin}</span></li>
              </ul>

              erhalten Sie eine Pflegeanleitung; Leder- und Holzpflegemittel senden wir Ihnen auf Wunsch
              kostenfrei nach.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  // Ansichten
  $$("#pdp-thumbs button").forEach((btn) => {

}
      initPage();

  "warenkorb.html": {

  "ueber-uns.html": {
    page: "about",
    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\">Startseite</a> · Manufaktur</div>\n      <span class=\"eyebrow\">Seit 1974</span>\n      <h1>Eine Werkstatt,<br>keine Fabrik.</h1>\n      <p class=\"lede\">Maison Noir wurde von Anna und Josef Farber als kleine Polsterei in München gegründet.\n      Heute arbeiten wir mit sieben Werkstätten in vier Ländern — nach denselben Regeln wie damals.</p>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__media\" id=\"art-1\"></div>\n    <div class=\"split__text\">\n      <span class=\"eyebrow\">Material</span>\n      <h2>Wir kaufen dort ein, wo wir hinfahren können.</h2>\n      <p>Unser Holz stammt aus Wäldern, die wir kennen. Die Leder kommen von zwei Gerbereien in der Toskana,\n      die noch pflanzlich gerben — ein Verfahren, das Wochen dauert statt Stunden.</p>\n      <p>Wir verwenden keine Spanplatten, keine geklebten Furnierschichten in tragenden Teilen und keine\n      Schäume, die nach fünf Jahren zusammenfallen. Das macht unsere Möbel teurer. Und deutlich langlebiger.</p>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"grid grid--3\">\n        <div class=\"value reveal\">\n          <span class=\"num\">52</span>\n          <h3>Jahre Erfahrung</h3>\n          <p class=\"muted\">Gegründet 1974 in München, seither in Familienhand.</p>\n        </div>\n        <div class=\"value reveal\">\n          <span class=\"num\">7</span>\n          <h3>Partnerwerkstätten</h3>\n          <p class=\"muted\">In Deutschland, Italien, Dänemark und Belgien.</p>\n        </div>\n        <div class=\"value reveal\">\n          <span class=\"num\">10</span>\n          <h3>Jahre Garantie</h3>\n          <p class=\"muted\">Auf Rahmen, Federung und Verarbeitung — reparieren statt ersetzen.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__text split--dark\">\n      <span class=\"eyebrow\">Verfahren</span>\n      <h2>Wie ein Sofa entsteht.</h2>\n      <ol style=\"list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:1.6rem\">\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">01 — Auswahl</strong>\n          <p style=\"margin:.35rem 0 0\">Sie wählen Modell, Bezug und Maße. Muster senden wir vorab nach Hause.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">02 — Rahmen</strong>\n          <p style=\"margin:.35rem 0 0\">Der Schreiner baut den Rahmen aus zwei Jahre lang lufttrockneter Eiche.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">03 — Polsterung</strong>\n          <p style=\"margin:.35rem 0 0\">Federn werden von Hand gebunden, Rosshaar und Schaum in Lagen aufgebaut.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">04 — Bezug</strong>\n          <p style=\"margin:.35rem 0 0\">Der Bezug wird zugeschnitten, genäht und nass über den Korpus gezogen.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">05 — Lieferung</strong>\n          <p style=\"margin:.35rem 0 0\">Zwei Monteure bringen das Stück in den Raum und nehmen die Verpackung mit.</p></li>\n      </ol>\n    </div>\n    <div class=\"split__media\" id=\"art-2\"></div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"section-head reveal\">\n        <div>\n          <span class=\"eyebrow\">Pflege</span>\n          <h2>Damit es lange schön bleibt</h2>\n        </div>\n      </div>\n      <div class=\"acc\" style=\"max-width:820px\">\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"true\">Leder <i>+</i></button>\n          <div class=\"acc__panel is-open\"><p>Anilinleder einmal im Monat mit einem trockenen, weichen Tuch\n          abstauben und zweimal jährlich mit Lederbalsam pflegen. Direkte Sonne meiden — sie bleicht das\n          Leder ungleichmäßig aus. Flecken nie mit Wasser reiben, sondern tupfen.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\">Massivholz <i>+</i></button>\n          <div class=\"acc__panel\"><p>Geölte Oberflächen mit klarem Wasser und wenig Seife reinigen. Einmal\n          jährlich mit Hartwachsöl in Faserrichtung nachölen. Kleine Kratzer verschwinden dabei fast\n          vollständig — anders als bei lackierten Flächen.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\">Leinen und Wolle <i>+</i></button>\n          <div class=\"acc__panel\"><p>Wöchentlich mit geringer Saugkraft absaugen. Abnehmbare Bezüge bei 30 °C\n          im Schonwaschgang waschen und leicht feucht wieder aufziehen. Bouclé nicht bürsten — die Schlingen\n          reißen sonst auf.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\">Messing und Stein <i>+</i></button>\n          <div class=\"acc__panel\"><p>Unbehandeltes Messing dunkelt bewusst nach. Wer den hellen Glanz halten\n          möchte, poliert es alle paar Monate mit Messingpolitur. Travertin und Marmor vertragen keine\n          Säuren — Zitrone, Essig und Rotwein sofort abnehmen.</p></div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section\" style=\"background:var(--paper-2)\">\n    <div class=\"wrap center\">\n      <span class=\"eyebrow\">Besuchen Sie uns</span>\n      <h2>Showroom München</h2>\n      <p class=\"lede\" style=\"margin-inline:auto\">Maximilianstraße 12 · 80539 München<br>\n      Montag bis Freitag 10–19 Uhr, Samstag 11–17 Uhr</p>\n      <a class=\"btn\" href=\"kontakt.html\" style=\"margin-top:1rem\">Termin vereinbaren</a>\n    </div>\n  </section>",

  "kontakt.html": {

    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\">Startseite</a> · Kontakt</div>\n      <h1>Sprechen wir<br>über Ihren Raum.</h1>\n      <p class=\"lede\">Ob eine einzelne Frage zum Material oder die Einrichtung einer ganzen Wohnung —\n      wir nehmen uns Zeit. Antwort innerhalb eines Werktages.</p>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"grid grid--form\">\n\n        <form data-demo>\n          <h3>Anfrage senden</h3>\n          <div class=\"form-row\">\n            <div class=\"field\">\n              <label for=\"name\">Name</label>\n              <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n            </div>\n            <div class=\"field\">\n              <label for=\"email\">E-Mail</label>\n              <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n            </div>\n          </div>\n          <div class=\"form-row\">\n            <div class=\"field\">\n              <label for=\"phone\">Telefon (optional)</label>\n              <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\">\n            </div>\n            <div class=\"field\">\n              <label for=\"topic\">Anliegen</label>\n              <select id=\"topic\" name=\"topic\">\n                <option>Beratungstermin im Showroom</option>\n                <option>Beratung bei mir zu Hause</option>\n                <option>Frage zu einem Entwurf</option>\n                <option>Materialmuster anfordern</option>\n                <option>Bestehende Bestellung</option>\n                <option>Sonstiges</option>\n              </select>\n            </div>\n          </div>\n          <div class=\"field\">\n            <label for=\"message\">Ihre Nachricht</label>\n            <textarea id=\"message\" name=\"message\" required placeholder=\"Erzählen Sie uns kurz von Ihrem Raum, Ihren Maßen und Ihrem Zeitrahmen.\"></textarea>\n          </div>\n          <p class=\"form-note\">Mit dem Absenden stimmen Sie zu, dass wir Ihre Angaben zur Bearbeitung\n          der Anfrage verwenden. Wir geben nichts an Dritte weiter.</p>\n          <button class=\"btn\" type=\"submit\" style=\"margin-top:1rem\">Anfrage senden</button>\n          <div class=\"form-msg\" data-msg hidden style=\"margin-top:1.2rem\"></div>\n        </form>\n\n        <aside>\n          <h3>Direkt erreichbar</h3>\n          <ul class=\"specs\" style=\"margin-bottom:2.5rem\">\n            <li><span>Telefon</span><a href=\"tel:+498912345678\">+49 89 1234 5678</a></li>\n            <li><span>E-Mail</span><a href=\"mailto:salon@maison-noir.de\">salon@maison-noir.de</a></li>\n            <li><span>Erreichbarkeit</span><span>Mo–Fr 9–18 Uhr</span></li>\n          </ul>\n\n          <h3>Showroom</h3>\n          <p class=\"muted\">Maximilianstraße 12<br>80539 München<br>Deutschland</p>\n          <ul class=\"specs\" style=\"margin-bottom:2.5rem\">\n            <li><span>Montag – Freitag</span><span>10–19 Uhr</span></li>\n            <li><span>Samstag</span><span>11–17 Uhr</span></li>\n            <li><span>Sonntag</span><span>geschlossen</span></li>\n          </ul>\n\n          <div style=\"border:1px solid var(--line);padding:1.6rem;border-radius:var(--radius);background:var(--card)\">\n            <span class=\"eyebrow\">Hinweis</span>\n            <p style=\"margin:0;font-size:.92rem\" class=\"muted\">Dies ist eine Demonstrationsseite.\n            Das Formular sendet noch keine echten Nachrichten — die Anbindung an ein Postfach oder\n            CRM lässt sich jederzeit ergänzen.</p>\n          </div>\n        </aside>\n\n      </div>\n    </div>\n  </section>",

function initPage() {
  const topic = queryParams().get("thema");
  if (topic) { const sel = $("#topic"); [...sel.options].forEach(o => { if (o.text === topic) sel.value = o.value; }); }
}
      initPage();
    }
  }
};

function currentRoute() {
  const hash = location.hash.replace(/^#/, "");
  const file = (hash.split("?")[0] || "index.html").trim();
  return ROUTES[file] ? file : "index.html";
}

function renderRoute() {
  const key = currentRoute();
  const route = ROUTES[key];

  clearPageListeners();
  document.dispatchEvent(new Event("route:changed"));
  document.body.dataset.page = route.page;
  document.querySelectorAll("#nav a").forEach(function (a) {
    a.classList.toggle("is-active", a.getAttribute("href") === key);
  });

  const app = document.getElementById("app");
  app.innerHTML = route.html;
  route.init();
  bindAddButtons(app);
  initAccordions(app);
  initForms();
  initReveal();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* Interne Verweise auf die Raute umlenken */
document.addEventListener("click", function (e) {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || !/^[\w-]+\.html(\?|$)/.test(href)) return;
  e.preventDefault();
  const next = "#" + href;
  if (location.hash === next) renderRoute();
  else location.hash = next;
});

function boot() {
  if (!document.getElementById("nav")) renderChrome();
  renderRoute();
}

window.addEventListener("hashchange", renderRoute);
document.addEventListener("DOMContentLoaded", renderRoute);
if (document.readyState !== "loading") boot();
</script>
