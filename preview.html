  "confortable", "moelleux", "solide", "qualite", "recommand", "vaut", "agreable", "belle",
  "comodo", "comoda", "calidad", "resistente", "duradero", "bonito", "bonita", "merece",
  "recomend", "agradable"
];

/* „schön“ wird ohne Umlaut zu „schon“ — und das heißt auch „bereits“.
   Als Lob zählt es nur, wenn nicht nach dem Verbleib gefragt wird. */
const BOT_SCHON_AUS = ["verkauft", "weg", "vergeben", "bestellt", "versendet", "reserviert", "sold", "gone", "vendu", "vendido"];

/* Fragen nach Maßen oder Material werden nicht gelobt, sondern beantwortet */
const BOT_SPEC_WORDS = ["material", "matiere", "materia", "woraus", "besteht", "made of", "made from"];

const BOT_LIMIT_WORDS = ["unter", "bis", "hochstens", "maximal", "max", "weniger", "budget", "billiger", "gunstiger", "under", "below", "less", "up to", "cheaper", "moins", "sous", "jusqu", "menos", "hasta", "presupuesto", "barato"];
const BOT_CHEAP_WORDS = ["gunstigst", "billigst", "preiswertest", "cheapest", "least expensive", "moins cher", "mas barat", "economic"];
const BOT_DEAR_WORDS = ["teuerst", "hochste", "most expensive", "dearest", "plus cher", "mas car"];

/* Zahl aus der Frage lesen: 3000, 3.000, 3,000, 3k, 3 tsd */
function botBudget(text) {
  const m = text.match(/(\d[\d.,\s]*)\s*(k\b|tsd|tausend|mil\b|mille)?/);
  if (!m) return 0;
  const zahl = parseInt(m[1].replace(/[.,\s]/g, ""), 10);
  if (!Number.isFinite(zahl) || zahl <= 0) return 0;
  return m[2] && zahl < 1000 ? zahl * 1000 : zahl;
}

const botEsc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- In welcher Sprache wird gefragt? ----------
   Kunden schreiben nicht immer in der Sprache, die oben eingestellt ist.
   Erkannt wird an häufigen Funktionswörtern; wer in mehreren Sprachen
   vorkommt („la“, „no“, „que“), zählt entsprechend weniger. */
const BOT_MARKER = {
  de: ["ist", "sind", "der", "die", "das", "und", "ich", "wie", "was", "wo", "wer", "haben", "habt", "kann", "koennen", "bitte", "danke", "nicht", "gibt", "mit", "fuer", "auf", "noch", "ein", "eine", "einen", "sie", "mir", "mich", "euch", "kostet", "wieviel", "viel", "gebraucht", "auch", "aber", "oder", "sehr", "bei", "von", "zum", "gut"],
  en: ["is", "are", "the", "and", "i", "how", "what", "where", "who", "do", "does", "can", "could", "please", "thanks", "thank", "not", "there", "with", "for", "on", "an", "you", "me", "my", "cost", "costs", "much", "used", "also", "but", "or", "very", "at", "from", "to", "have", "has", "it"],
  fr: ["est", "sont", "le", "la", "les", "et", "je", "comment", "quoi", "ou", "qui", "avez", "avoir", "peut", "puis", "pouvez", "merci", "pas", "il", "avec", "pour", "sur", "un", "une", "vous", "moi", "prix", "coute", "combien", "aussi", "mais", "tres", "de", "du", "des", "ce", "cette", "quel", "quelle", "est-ce"],
  es: ["es", "son", "el", "la", "los", "las", "y", "yo", "como", "que", "donde", "quien", "tiene", "tienen", "puedo", "puede", "gracias", "favor", "no", "hay", "con", "para", "sobre", "un", "una", "usted", "precio", "cuesta", "cuanto", "tambien", "pero", "muy", "del", "esta", "este", "esa", "algun", "alguna"]
};

/* Wörter, die nur in einer Sprache vorkommen, wiegen am schwersten */
const BOT_MARKER_GEWICHT = (() => {
  const zaehler = {};
  Object.keys(BOT_MARKER).forEach((l) => BOT_MARKER[l].forEach((w) => { zaehler[w] = (zaehler[w] || 0) + 1; }));
  const tabelle = {};
  Object.keys(BOT_MARKER).forEach((l) => {
    tabelle[l] = {};
    BOT_MARKER[l].forEach((w) => { tabelle[l][w] = 1 / zaehler[w]; });
  });
  return tabelle;
})();

function botSprache(frage) {
  const roh = String(frage || "");
  const woerter = normalize(roh).split(/[^a-z0-9-]+/).filter(Boolean);
  if (woerter.length < 2) return null;

  const punkte = { de: 0, en: 0, fr: 0, es: 0 };
  woerter.forEach((w) => {
    Object.keys(punkte).forEach((l) => { punkte[l] += BOT_MARKER_GEWICHT[l][w] || 0; });
  });
  // Schriftzeichen sind ein starkes Indiz, das kein Funktionswort schlägt
  if (/[äöüß]/i.test(roh)) punkte.de += 1.5;
  if (/[ñ¿¡]/i.test(roh)) punkte.es += 1.5;
  if (/[çœ]|’|qu'/i.test(roh)) punkte.fr += 1;

  const rang = Object.keys(punkte).sort((a, b) => punkte[b] - punkte[a]);
  const erster = punkte[rang[0]], zweiter = punkte[rang[1]];
  if (erster < 1 || erster < zweiter * 1.4) return null;
  return I18N[rang[0]] ? rang[0] : null;
}

const botCond = (p, lang) => (p.grade ? t("grade." + p.grade, null, lang) : t("cond.used", null, lang));

/* ---------- Die eigentliche Antwort ---------- */
function botAnswer(frage, lang) {
  const bt = (key, vars) => t(key, vars, lang);
  const beuro = (n) => euro(n, lang);
  const q = normalize(frage).trim();
  if (!q) return { lang, text: bt("bot.a.fallback") };

  const gelobt = BOT_LOB_WORDS.some((w) => botHit(q, w)) ||
    (botHit(q, "schon") && !BOT_SCHON_AUS.some((w) => botHit(q, w)));

  /* Welche feste Auskunft passt? Das längste Stichwort gewinnt. */
  const intentTreffer = (key) => {
    const intent = BOT_INTENTS.find((i) => i.key === key);
    let punkte = 0;
    for (const w of intent.words) if (botHit(q, w)) punkte = Math.max(punkte, w.trim().length);
    return punkte;
  };
  let beste = null;
  for (const intent of BOT_INTENTS) {
    const punkte = intentTreffer(intent.key);
    if (punkte && (!beste || punkte > beste.punkte)) beste = { key: intent.key, punkte };
  }
  const festeAuskunft = () => {
    const vars = { code: GUTSCHEIN.code, betrag: beuro(GUTSCHEIN.betrag) };
    const antwort = { lang, text: bt("bot.a." + beste.key, vars) };
    if (beste.key === "contact" || beste.key === "showroom") antwort.contact = true;
    if (beste.key === "used" || beste.key === "stock") antwort.all = true;
    return antwort;
  };
  const fragtNachAngaben = intentTreffer("sizes") > 0 || BOT_SPEC_WORDS.some((w) => botHit(q, w));

  /* 1. Ein Stück beim Namen genannt */
  const genannt = PRODUCTS.filter((p) => botHit(q, normalize(p.name)));
  if (genannt.length === 1) {
    const p = genannt[0];
    if (gelobt) {
      return {
        lang,
        text: bt("bot.a.lob.produkt", { name: p.name, short: pt(p, lang).short, cond: botCond(p, lang) }),
        products: [p]
      };
    }
    if (fragtNachAngaben) {
      const x = pt(p, lang);
      return {
        lang,
        text: bt("bot.a.spec", { name: p.name, dimensions: x.dimensions, weight: p.weight, material: x.material, origin: x.origin }),
        products: [p]
      };
    }
    // Wer nach Lieferung oder Pflege fragt und dabei ein Stück nennt, will
    // die Auskunft hören und nicht den Preis vorgelesen bekommen.
    if (beste && beste.punkte >= 5) return festeAuskunft();
    return {
      lang,
      text: bt("bot.a.price.one", { name: p.name, price: beuro(p.price), cond: botCond(p, lang) }),
      products: [p]
    };
  }
  if (genannt.length > 1) return { lang, text: bt("bot.a.found"), products: genannt };

  /* 2. Superlative */
  const sortiert = [...PRODUCTS].sort((a, b) => a.price - b.price);
  if (BOT_CHEAP_WORDS.some((w) => botHit(q, w))) {
    const p = sortiert[0];
    return { lang, text: bt("bot.a.cheapest", { name: p.name, price: beuro(p.price) }), products: [p] };
  }
  if (BOT_DEAR_WORDS.some((w) => botHit(q, w))) {
    const p = sortiert[sortiert.length - 1];
    return { lang, text: bt("bot.a.dearest", { name: p.name, price: beuro(p.price) }), products: [p] };
  }

  /* 3. Rubrik erkannt? (wird gleich für Budget und Rubrikliste gebraucht) */
  let rubrik = null;
  for (const key of Object.keys(BOT_CATEGORIES)) {
    if (BOT_CATEGORIES[key].some((w) => botHit(q, w))) { rubrik = key; break; }
  }

  /* 3b. Eigenschaftsfrage zu einer ganzen Rubrik */
  if (gelobt && rubrik) {
    const treffer = PRODUCTS.filter((p) => p.categoryKey === rubrik).sort((a, b) => a.price - b.price);
    return { lang, text: bt("bot.a.lob.rubrik", { cat: bt("cat." + rubrik) }), products: treffer.slice(0, 5) };
  }

  /* 4. Budget */
  const grenze = botBudget(q);
  const budgetFrage = grenze >= 100 && (BOT_LIMIT_WORDS.some((w) => botHit(q, w)) || rubrik || /€|euro/.test(q));
  if (budgetFrage) {
    const pool = rubrik ? PRODUCTS.filter((p) => p.categoryKey === rubrik) : PRODUCTS;
    const treffer = pool.filter((p) => p.price <= grenze).sort((a, b) => b.price - a.price);
    if (treffer.length) {
      const schluessel = treffer.length === 1 ? "bot.a.budget.one" : "bot.a.budget";
      return { lang, text: bt(schluessel, { max: beuro(grenze), n: treffer.length }), products: treffer.slice(0, 5) };
    }
    const billigste = [...pool].sort((a, b) => a.price - b.price)[0] || sortiert[0];
    return {
      lang,
      text: bt("bot.a.budget.none", { max: beuro(grenze), name: billigste.name, price: beuro(billigste.price) }),
      products: [billigste]
    };
  }

  /* 5. Feste Auskünfte */
  if (beste && beste.punkte >= 3) return festeAuskunft();

  /* 6. Rubrik ohne Budget */
  if (rubrik) {
    const treffer = PRODUCTS.filter((p) => p.categoryKey === rubrik).sort((a, b) => a.price - b.price);
    const cat = bt("cat." + rubrik);
    if (!treffer.length) return { lang, text: bt("bot.a.cat.none", { cat }), all: true };
    const schluessel = treffer.length === 1 ? "bot.a.cat.one" : "bot.a.cat";
    return { lang, text: bt(schluessel, { cat, n: treffer.length }), products: treffer.slice(0, 5) };
  }

  /* 7. Volltextsuche über die Kollektion */
  const gefunden = searchProducts(frage, lang).slice(0, 5);
  if (gefunden.length) return { lang, text: bt("bot.a.found"), products: gefunden };

  /* 8. Eigenschaftsfrage ohne erkennbaren Bezug */
  if (gelobt) return { lang, text: bt("bot.a.lob.allgemein"), all: true };

  return { lang, text: bt("bot.a.fallback"), contact: true, all: true };
}

/* ---------- Oberfläche ---------- */
let botGebunden = false;

function initBerater() {
  const host = $("#site-footer");
  if (!host || $("#bot-panel")) return;

  const wrap = document.createElement("div");
  wrap.className = "bot-wrap";
  wrap.innerHTML = `
  <button class="bot-launch" id="bot-launch" type="button" aria-expanded="false" aria-controls="bot-panel" title="${botEsc(t("bot.launch"))}">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 12.4c0 4-3.8 7.2-8.5 7.2-1 0-2-.15-2.9-.42L4 21l1.4-3.7C4.2 16 3.5 14.3 3.5 12.4c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2Z"/>
    </svg>
    <span class="bot-launch__label">${botEsc(t("bot.launch"))}</span>
  </button>
  <section class="bot" id="bot-panel" role="dialog" aria-labelledby="bot-title">
    <header class="bot__head">
      <span class="bot__dot" aria-hidden="true"></span>
      <div class="bot__id">
        <strong id="bot-title">${botEsc(t("bot.title"))}</strong>
        <small data-i18n="bot.sub"></small>
      </div>
      <button class="close-x" id="bot-close" type="button" data-i18n-aria="bot.close">×</button>
    </header>
    <div class="bot__log" id="bot-log" role="log" aria-live="polite" data-i18n-aria="bot.log"></div>
    <div class="bot__chips" id="bot-chips"></div>
    <form class="bot__form" id="bot-form" novalidate>
      <input type="text" id="bot-input" autocomplete="off" data-i18n-placeholder="bot.placeholder" data-i18n-aria="bot.placeholder">
      <button class="bot__send" type="submit" data-i18n-aria="bot.send" title="${botEsc(t("bot.send"))}">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h14M12 6l6 6-6 6"/>
        </svg>
      </button>
    </form>
    <p class="bot__hint" data-i18n="bot.hint"></p>
  </section>`;
  host.appendChild(wrap);
  applyI18n(wrap);

  const panel = $("#bot-panel");
  const launch = $("#bot-launch");
  const log = $("#bot-log");
  const input = $("#bot-input");
  const chips = $("#bot-chips");

  /* Geschlossen heißt: nicht sichtbar, nicht anklickbar, nicht antippbar */
  const setOpen = (open) => {
    if (!open && panel.contains(document.activeElement)) launch.focus();
    panel.classList.toggle("is-open", open);
    launch.classList.toggle("is-open", open);
    launch.setAttribute("aria-expanded", String(open));
    panel.inert = !open;
    panel.setAttribute("aria-hidden", String(!open));
    if (open) {
      if (!log.children.length) sag(t("bot.intro"));
      // Erst wenn das Feld sichtbar ist, darf der Fokus hinein
      requestAnimationFrame(() => input.focus());
      scrollDown();
    }
  };
  const isOpen = () => panel.classList.contains("is-open");

  const scrollDown = () => { log.scrollTop = log.scrollHeight; };

  /* Die Sprache des Gesprächs: erkannt an der Frage, sonst die zuletzt
     erkannte — sonst die eingestellte. So bleibt ein französisches Gespräch
     französisch, auch wenn eine kurze Rückfrage kein Merkmal enthält. */
  let gespraechsSprache = null;

  function blase(rolle, inhaltHtml, lang) {
    const el = document.createElement("div");
    el.className = "bot__msg bot__msg--" + rolle;
    const wer = rolle === "you" ? t("bot.you", null, lang) : t("bot.name", null, lang);
    el.innerHTML = `<span class="bot__who">${botEsc(wer)}</span>${inhaltHtml}`;
    log.appendChild(el);
    scrollDown();
    return el;
  }

  const sag = (text) => blase("bot", `<p>${botEsc(text)}</p>`);

  function antwortHtml(a) {
    const l = a.lang;
    let html = `<p>${botEsc(a.text)}</p>`;
    if (a.products && a.products.length) {
      html += `<ul class="bot__list">` + a.products.map((p) => `
        <li><a href="produkt.html?id=${encodeURIComponent(p.id)}" data-bot-link>
          <span>${botEsc(p.name)}</span><em>${botEsc(euro(p.price, l))}</em>
          <small>${botEsc(t("cat." + p.categoryKey, null, l))} · ${botEsc(botCond(p, l))}</small>
        </a></li>`).join("") + `</ul>`;
    }
    const links = [];
    if (a.all) links.push(`<a href="kollektion.html" data-bot-link>${botEsc(t("bot.cta.all", null, l))}</a>`);
    if (a.contact) links.push(`<a href="kontakt.html" data-bot-link>${botEsc(t("bot.cta.contact", null, l))}</a>`);
    if (links.length) html += `<p class="bot__cta">${links.join("")}</p>`;
    return html;
  }

  let denkt = null;
  function frage(text) {
    const sauber = text.trim().slice(0, 300);
    if (!sauber) return;
    const lang = botSprache(sauber) || gespraechsSprache || getLang();
    gespraechsSprache = lang;
    blase("you", `<p>${botEsc(sauber)}</p>`, lang);
    input.value = "";
    if (denkt) denkt.remove();
    denkt = blase("bot", `<p class="bot__typing"><i></i><i></i><i></i><span class="sr-only">${botEsc(t("bot.typing", null, lang))}</span></p>`, lang);
    const wartezeit = 260 + Math.min(500, sauber.length * 9);
    setTimeout(() => {
      if (denkt) { denkt.remove(); denkt = null; }
      const a = botAnswer(sauber, lang);
      blase("bot", antwortHtml(a), a.lang);
    }, wartezeit);
  }

  /* Vorschläge: einmal gestellt, verschwinden sie nicht — sie bleiben
     als schneller Einstieg stehen. */
  ["bot.suggest.budget", "bot.suggest.delivery", "bot.suggest.used", "bot.suggest.voucher"].forEach((k) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "bot__chip";
    b.textContent = t(k);
    b.addEventListener("click", () => frage(b.textContent));
    chips.appendChild(b);
  });

  launch.addEventListener("click", () => setOpen(!isOpen()));
  $("#bot-close").addEventListener("click", () => setOpen(false));
  $("#bot-form").addEventListener("submit", (e) => { e.preventDefault(); frage(input.value); });

  /* Ein Verweis in der Antwort führt weiter — in der Einzeldatei über die Raute */
  log.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-bot-link]");
    if (!a) return;
    e.preventDefault();
    goTo(a.getAttribute("href"));
    if (window.matchMedia("(max-width: 640px)").matches) setOpen(false);
  });

  if (!botGebunden) {
    botGebunden = true;
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const p = $("#bot-panel");
      if (p && p.classList.contains("is-open")) $("#bot-launch")?.click();
    });
    /* Warenkorb, Menü und Gutschein legen sich über den Berater —
       dann macht er Platz. */
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#cart-open, #burger, #promo-reopen")) return;
      const p = $("#bot-panel");
      if (p && p.classList.contains("is-open")) $("#bot-close")?.click();
    });
  }

  setOpen(false);
}

</script>

/* ---------- Einfache Wegführung für die Einzeldatei ---------- */

    page: "home",
    html: "<section class=\"hero\">\n    <div class=\"hero__bg\" id=\"hero-art\">\n      <span class=\"hero__caption caption\"><b>/ Studio Lusso</b> Material Inspiration</span>\n    </div>\n    <div class=\"hero__content\">\n      <span class=\"eyebrow\" data-i18n=\"home.hero.eyebrow\">Interior Design Concepts</span>\n      <h1 data-i18n-html=\"home.hero.title\">Räume als Lebensräume.<br>Design mit Substanz.</h1>\n      <span class=\"rule\"></span>\n      <p class=\"lede\" data-i18n=\"home.hero.lede\">Wir gestalten Räume, die über Trends hinausgehen. Als Interior Design Studio mit Fokus auf ganzheitliche Planung verbinden wir höchste gestalterische Ansprüche mit technischer Präzision.</p>\n      <div class=\"hero__actions\">\n        <a class=\"btn\" href=\"kollektion.html\" data-i18n=\"home.hero.cta1\">Kollektion ansehen</a>\n        <a class=\"btn btn--ghost\" href=\"kontakt.html\" data-i18n=\"home.hero.cta2\">Showroom besuchen</a>\n      </div>\n    </div>\n  </section>\n\n  <div class=\"features\">\n    <div class=\"feature\"><h4 data-i18n=\"home.feat1.t\">Geprüft &amp; aufbereitet</h4><p data-i18n=\"home.feat1.p\">Jedes gebrauchte Stück wird von Hand kontrolliert</p></div>\n    <div class=\"feature\"><h4 data-i18n=\"home.feat2.t\">Lieferung bis in den Raum</h4><p data-i18n=\"home.feat2.p\">Weißhandschuh-Service inklusive Montage</p></div>\n    <div class=\"feature\"><h4 data-i18n=\"home.feat3.t\">Einzelstücke</h4><p data-i18n=\"home.feat3.p\">Jedes Möbel gibt es nur einmal</p></div>\n    <div class=\"feature\"><h4 data-i18n=\"home.feat4.t\">Persönliche Beratung</h4><p data-i18n=\"home.feat4.p\">Im Showroom Hamburg oder bei Ihnen zu Hause</p></div>\n  </div>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"section-head reveal\">\n        <div>\n          <span class=\"eyebrow\" data-i18n=\"home.featured.eyebrow\">Ausgewählt</span>\n          <h2 data-i18n=\"home.featured.title\">Die Stücke der Saison</h2>\n          <span class=\"rule\"></span>\n        </div>\n        <a class=\"link-underline\" href=\"kollektion.html\" data-i18n=\"home.featured.link\">Alle 16 Stücke</a>\n      </div>\n      <div class=\"grid grid--3\" id=\"featured\"></div>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__media\" id=\"story-art\"></div>\n    <div class=\"split__text split--dark\">\n      <span class=\"eyebrow\" data-i18n=\"home.story.eyebrow\">Unsere Philosophie</span>\n      <h2 data-i18n=\"home.story.title\">Für Räume, die wirken.</h2>\n          <span class=\"rule\"></span>\n      <p data-i18n=\"home.story.p1\">Wir sind überzeugt: Exzellentes Interior Design entsteht im Dialog — zwischen Vision und Machbarkeit, zwischen Kreativität und Struktur, zwischen Ästhetik und Alltagstauglichkeit.</p>\n      <p data-i18n=\"home.story.p2\">Mit Leidenschaft, Expertise und einem klaren gestalterischen Anspruch entwickeln wir Räume, die zu Lebensräumen werden. Nicht beliebig, sondern einzigartig.</p>\n      <div style=\"margin-top:1.5rem\"><a class=\"link-underline\" href=\"ueber-uns.html\" data-i18n=\"home.story.link\">Das Studio kennenlernen</a></div>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"section-head reveal\">\n        <div>\n          <span class=\"eyebrow\" data-i18n=\"home.cats.eyebrow\">Nach Raum</span>\n          <h2 data-i18n=\"home.cats.title\">Wo möchten Sie beginnen?</h2>\n          <span class=\"rule\"></span>\n        </div>\n      </div>\n      <div class=\"grid grid--3\" id=\"cats\"></div>\n    </div>\n  </section>\n\n  <section class=\"section\" style=\"background:var(--paper-2)\">\n    <div class=\"wrap center\">\n      <blockquote class=\"quote reveal\">\n        <span data-i18n=\"home.quote\">„Studio Lusso. Für Räume, die wirken.“</span>\n        <cite data-i18n=\"home.quote.cite\">Studio Lusso · Hamburg</cite>\n      </blockquote>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__text\">\n      <span class=\"eyebrow\" data-i18n=\"home.service.eyebrow\">Service</span>\n      <h2 data-i18n=\"home.service.title\">Wir planen Ihren Raum mit.</h2>\n          <span class=\"rule\"></span>\n      <p data-i18n=\"home.service.p\">Unsere Beraterinnen und Berater kommen zu Ihnen, nehmen Maß, bringen Muster mit und entwerfen einen Plan — kostenfrei und unverbindlich.</p>\n      <ul class=\"specs\" style=\"margin:1.5rem 0 2rem\">\n        <li><span data-i18n=\"home.service.r1\">Erstgespräch</span><span data-i18n=\"home.service.v1\">kostenfrei</span></li>\n        <li><span data-i18n=\"home.service.r2\">Raumplanung inkl. 3D-Ansicht</span><span data-i18n=\"home.service.v2\">ab 2 Wochen</span></li>\n        <li><span data-i18n=\"home.service.r3\">Materialmuster nach Hause</span><span data-i18n=\"home.service.v3\">inklusive</span></li>\n      </ul>\n      <div><a class=\"btn\" href=\"kontakt.html\" data-i18n=\"home.service.cta\">Termin vereinbaren</a></div>\n    </div>\n    <div class=\"split__media\" id=\"service-art\"></div>\n  </section>\n\n  <section class=\"section newsletter\">\n    <div class=\"wrap center\">\n      <span class=\"eyebrow\" data-i18n=\"home.news.eyebrow\">Bleiben Sie in Verbindung</span>\n      <h2 data-i18n=\"home.news.title\">Neue Entwürfe zuerst sehen</h2>\n          <span class=\"rule\"></span>\n      <p class=\"lede\" style=\"margin-inline:auto;color:rgba(250,247,242,.75)\" data-i18n=\"home.news.lede\">Etwa sechs Mal im Jahr schreiben wir über neue Stücke, Werkstattbesuche und Einblicke ins Handwerk.</p>\n      <form data-demo>\n        <input type=\"email\" name=\"email\" required data-i18n-placeholder=\"home.news.placeholder\" data-i18n-aria=\"home.news.placeholder\" placeholder=\"Ihre E-Mail-Adresse\" aria-label=\"Ihre E-Mail-Adresse\">\n        <button class=\"btn btn--light\" type=\"submit\" data-i18n=\"home.news.cta\">Abonnieren</button>\n        <div class=\"form-msg\" data-msg hidden style=\"flex:1 1 100%;border-color:rgba(250,247,242,.4);background:rgba(250,247,242,.08)\"></div>\n      </form>\n    </div>\n  </section>",

  "kollektion.html": {
    page: "shop",
    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\" data-i18n=\"nav.home\">Startseite</a> · <span data-i18n=\"nav.shop\">Kollektion</span></div>\n      <h1 data-i18n=\"shop.title\">Die Kollektion</h1>\n      <span class=\"rule\"></span>\n      <p class=\"lede\" data-i18n=\"shop.lede\">Sechzehn Stücke, die wir derzeit anbieten. Alles stammt aus zweiter Hand — Möbel wie Leuchten sind Einzelstücke und jeweils nur einmal zu haben.</p>\n    </div>\n  </section>\n\n  <section class=\"section\" style=\"padding-top:clamp(2.5rem,5vw,4rem)\">\n    <div class=\"wrap\">\n      <div class=\"toolbar\">\n        <div class=\"filters\" id=\"filters\"></div>\n        <div style=\"display:flex;gap:1rem;flex-wrap:wrap;align-items:center\">\n          <label class=\"shop-search\">\n            <svg viewBox=\"0 0 20 20\" width=\"15\" height=\"15\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n              <circle cx=\"8.5\" cy=\"8.5\" r=\"5.5\"/><line x1=\"12.6\" y1=\"12.6\" x2=\"17.5\" y2=\"17.5\" stroke-linecap=\"round\"/>\n            </svg>\n            <input type=\"search\" id=\"shop-search\" data-i18n-placeholder=\"shop.searchPlaceholder\" data-i18n-aria=\"shop.search\" autocomplete=\"off\" placeholder=\"Name, Kategorie oder Material\" aria-label=\"Suchen\">\n            <button type=\"button\" id=\"shop-search-clear\" data-i18n-aria=\"search.clear\" hidden aria-label=\"Suche zurücksetzen\">×</button>\n          </label>\n          <div class=\"sort\">\n            <label for=\"sort\" data-i18n=\"shop.sort\">Sortieren</label>\n            <select id=\"sort\">\n              <option value=\"empfohlen\" data-i18n=\"shop.sort.featured\">Empfohlen</option>\n              <option value=\"preis-auf\" data-i18n=\"shop.sort.priceUp\">Preis aufsteigend</option>\n              <option value=\"preis-ab\" data-i18n=\"shop.sort.priceDown\">Preis absteigend</option>\n              <option value=\"name\" data-i18n=\"shop.sort.name\">Name A–Z</option>\n            </select>\n          </div>\n        </div>\n      </div>\n\n      <p class=\"muted\" id=\"result-count\" style=\"font-size:.85rem;letter-spacing:.1em;text-transform:uppercase\"></p>\n      <div class=\"grid grid--3\" id=\"products\" style=\"margin-top:1.5rem\"></div>\n    </div>\n  </section>",
    init: function () {
let activeCat = "alle";
let activeQuery = "";
let ersterAufbau = true;

function initPage() {
  const params = queryParams();
  activeCat = categoryKeyFrom(params.get("kategorie")) || "alle";
  activeQuery = params.get("suche") || "";

  $("#filters").innerHTML = CATEGORY_KEYS.map((c) =>
    `<button class="chip ${c === activeCat ? "is-active" : ""}" data-cat="${c}">${t("cat." + c)}</button>`).join("");

  $$("#filters .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      activeCat = chip.dataset.cat;
      $$("#filters .chip").forEach((c) => c.classList.toggle("is-active", c === chip));
      setParam("kategorie", activeCat === "alle" ? null : activeCat);
      renderList();
    });
  });

  const field = $("#shop-search");
  field.value = activeQuery;
  field.addEventListener("input", () => {
    activeQuery = field.value;
    setParam("suche", activeQuery.trim() ? activeQuery.trim() : null);
    renderList();
  });
  $("#shop-search-clear").addEventListener("click", () => {
    field.value = "";
    activeQuery = "";
    setParam("suche", null);
    renderList();
    field.focus();
  });

  $("#sort").addEventListener("change", renderList);
  renderList();
}

function renderList() {
  const query = activeQuery.trim();
  let list = query ? searchProducts(query) : [...PRODUCTS];
  if (activeCat !== "alle") list = list.filter((p) => p.categoryKey === activeCat);

  switch ($("#sort").value) {
    case "preis-auf": list.sort((a, b) => a.price - b.price); break;
    case "preis-ab":  list.sort((a, b) => b.price - a.price); break;
    case "name":      list.sort((a, b) => a.name.localeCompare(b.name, getLang())); break;
  }

  $("#shop-search-clear").hidden = !query;

  const parts = [list.length === 1 ? t("shop.count.one") : t("shop.count.many", { n: list.length })];
  if (activeCat !== "alle") parts.push(t("cat." + activeCat));
  if (query) parts.push(t("shop.for") + " „" + query + "“");
  $("#result-count").textContent = parts.join(" · ");

  const grid = $("#products");
  grid.innerHTML = list.length
    ? list.map(productCard).join("")
    : `<p class="muted">${t("shop.empty")}</p>`;

  bindAddButtons(grid);
  // Beim ersten Aufbau sanft einblenden, danach sofort zeigen — sonst
  // flackert die Liste bei jedem Tastendruck in der Suche.
  if (ersterAufbau) { initReveal(); ersterAufbau = false; }
  else $$("#products .card").forEach((c) => c.classList.add("is-visible"));
}
      initPage();
    }
  },
  "produkt.html": {
    page: "shop",
    html: "<section class=\"section\" style=\"padding-top:clamp(2rem,4vw,3.5rem)\" id=\"pdp-root\"></section>\n\n  <section class=\"section\" style=\"background:var(--paper-2)\" id=\"related-section\" hidden>\n    <div class=\"wrap\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\" data-i18n=\"pdp.related.eyebrow\">Passt dazu</span>\n          <h2 data-i18n=\"pdp.related.title\">Ebenfalls sehenswert</h2>\n          <span class=\"rule\"></span>\n        </div>\n        <a class=\"link-underline\" href=\"kollektion.html\" data-i18n=\"pdp.related.link\">Alle Entwürfe</a>\n      </div>\n      <div class=\"grid grid--3\" id=\"related\"></div>\n    </div>\n  </section>",
    init: function () {
let current, chosenColorIndex = 0, chosenQty = 1, chosenView = 0;

function initPage() {
  current = findProduct(queryParams().get("id"));

  if (!current) {
    $("#pdp-root").innerHTML = `
      <div class="wrap empty-state">
        <span class="eyebrow">${t("pdp.missing.eyebrow")}</span>
        <h1>${t("pdp.missing.title")}</h1>
        <p class="lede" style="margin-inline:auto">${t("pdp.missing.p")}</p>
        <a class="btn" href="kollektion.html" style="margin-top:1rem">${t("pdp.missing.cta")}</a>
      </div>`;
    return;
  }

  if (!isPreview()) document.title = current.name + " — Studio Lusso";
  chosenColorIndex = 0;
  chosenView = 0;
  renderPdp();
  renderRelated();
}

function renderPdp() {
  const p = current;
  const x = pt(p);
  const colors = productColors(p);

  $("#pdp-root").innerHTML = `
  <div class="wrap">
    <div class="crumbs">
      <a href="index.html">${t("nav.home")}</a> ·
      <a href="kollektion.html?kategorie=${p.categoryKey}">${t("cat." + p.categoryKey)}</a> · ${p.name}
    </div>

    <div class="pdp">
      <div class="pdp__gallery">
        <div class="gallery" id="gallery" role="group" aria-roledescription="carousel" aria-label="${t("gallery.label")}">
          <div class="pdp__main" id="pdp-main">${artFor(p, chosenColorIndex, chosenView)}</div>
          <button class="gallery__arrow gallery__arrow--prev" id="gal-prev" aria-label="${t("gallery.prev")}" aria-controls="pdp-main">‹</button>
          <button class="gallery__arrow gallery__arrow--next" id="gal-next" aria-label="${t("gallery.next")}" aria-controls="pdp-main">›</button>
          <span class="gallery__count" id="gal-count" aria-live="polite"></span>
        </div>
        <div class="pdp__thumbs" id="pdp-thumbs">
          ${VIEWS.map((v, i) => `
            <button data-view="${i}" class="${i === chosenView ? "is-active" : ""}"
                    aria-label="${t("view." + v.key)}" title="${t("view." + v.key)}"
                    >${artFor(p, chosenColorIndex, i)}</button>`).join("")}
        </div>
      </div>

      <div class="pdp__info">
        <span class="eyebrow">${t("cat." + p.categoryKey)} · ${p.used ? t("cond.used") : (x.badge || t("cond.new"))}</span>
        <h1 style="font-size:clamp(2.2rem,4vw,3.2rem)">${p.name}</h1>
        <div class="price">${euro(p.price)}</div>
        <p class="lede">${x.short}</p>

        <hr class="divider">

        <div class="field">
          <label>${t("pdp.variant")} — <span id="color-name">${colors[chosenColorIndex].name}</span></label>
          <div class="swatches" id="swatches">
            ${colors.map((c, i) => `
              <button class="swatch ${i === chosenColorIndex ? "is-active" : ""}" data-index="${i}"
                      style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join("")}
          </div>
        </div>

        <div class="buy-row" style="margin-top:1.6rem">
          ${p.used ? `<span class="claim" style="align-self:center">${t("pdp.unique")}</span>` : `
          <div class="qty">
            <button id="qty-minus" aria-label="${t("pdp.less")}">−</button>
            <span id="qty-value">1</span>
            <button id="qty-plus" aria-label="${t("pdp.more")}">+</button>
          </div>`}
          <button class="btn" id="add-to-cart">${t("pdp.add")}</button>
        </div>
        <p class="form-note" style="margin-top:1rem">${p.used ? t("pdp.note.used") : t("pdp.note", { lead: x.lead })}</p>

        <hr class="divider">

        <div class="acc">
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="true">${t("pdp.acc.desc")} <i>+</i></button>
            <div class="acc__panel is-open"><p>${x.description}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.spec")} <i>+</i></button>
            <div class="acc__panel">
              <ul class="specs">
                ${p.used ? `
                <li><span>${t("pdp.spec.condition")}</span><span>${t("grade." + p.grade)}</span></li>
                <li><span>${t("pdp.spec.year")}</span><span>${p.year}</span></li>` : ""}
                <li><span>${t("pdp.spec.material")}</span><span>${x.material}</span></li>
                <li><span>${t("pdp.spec.dimensions")}</span><span>${x.dimensions}</span></li>
                <li><span>${t("pdp.spec.weight")}</span><span>${p.weight}</span></li>
                <li><span>${t("pdp.spec.origin")}</span><span>${x.origin}</span></li>
              </ul>
            </div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${t("pdp.acc.delivery")} <i>+</i></button>
            <div class="acc__panel"><p>${t("pdp.delivery.body")}</p></div>
          </div>
          <div class="acc__item">
            <button class="acc__btn" aria-expanded="false">${p.used ? t("pdp.care.title.used") : t("pdp.acc.care")} <i>+</i></button>
            <div class="acc__panel"><p>${p.used ? t("pdp.care.used") : t("pdp.care.body")}</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  /* Galerie: vier Ansichten desselben Stücks, immer in der gewählten
     Ausführung. Bedienbar über die kleinen Bilder, die Pfeile und die
     Pfeiltasten der Tastatur. */
  function zeigeAnsicht(index) {
    chosenView = (index + VIEWS.length) % VIEWS.length;
    $("#pdp-main").innerHTML = artFor(current, chosenColorIndex, chosenView);
    $$("#pdp-thumbs button").forEach((b) =>
      b.classList.toggle("is-active", Number(b.dataset.view) === chosenView));
    $("#gal-count").textContent = t("gallery.count", { n: chosenView + 1, m: VIEWS.length });
  }

  function chooseColor(index) {
    chosenColorIndex = index;
    $("#color-name").textContent = productColors(current)[index].name;
    $$("#swatches .swatch").forEach((s) => s.classList.toggle("is-active", Number(s.dataset.index) === index));
    // Alle Bilder der Galerie in der neuen Ausführung neu zeichnen
    $$("#pdp-thumbs button").forEach((b) => {
      b.innerHTML = artFor(current, index, Number(b.dataset.view));
    });
    zeigeAnsicht(chosenView);
  }

  $$("#pdp-thumbs button").forEach((btn) =>
    btn.addEventListener("click", () => zeigeAnsicht(Number(btn.dataset.view))));
  $$("#swatches .swatch").forEach((sw) =>
    sw.addEventListener("click", () => chooseColor(Number(sw.dataset.index))));

  $("#gal-prev").addEventListener("click", () => zeigeAnsicht(chosenView - 1));
  $("#gal-next").addEventListener("click", () => zeigeAnsicht(chosenView + 1));
  $("#gallery").addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); zeigeAnsicht(chosenView - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); zeigeAnsicht(chosenView + 1); }
  });

  zeigeAnsicht(chosenView);

  // Bei Einzelstücken gibt es keine Mengenauswahl
  const qtyEl = $("#qty-value");
  if (qtyEl) {
    const max = bestand(current);
    $("#qty-minus").addEventListener("click", () => { chosenQty = Math.max(1, chosenQty - 1); qtyEl.textContent = chosenQty; });
    $("#qty-plus").addEventListener("click",  () => { chosenQty = Math.min(max, chosenQty + 1); qtyEl.textContent = chosenQty; });
  } else {
    chosenQty = 1;
  }

  $("#add-to-cart").addEventListener("click", () => {
    Cart.add(current.id, chosenQty, chosenColorIndex);
    toast(t("cart.added", { name: current.name + " (" + productColors(current)[chosenColorIndex].name + ")" }));
  });

  initAccordions($("#pdp-root"));
}

function renderRelated() {
  const rest = PRODUCTS.filter((p) => p.id !== current.id);
  const same = rest.filter((p) => p.categoryKey === current.categoryKey);
  const list = [...same, ...rest.filter((p) => p.categoryKey !== current.categoryKey)].slice(0, 3);
  $("#related").innerHTML = list.map(productCard).join("");
  $("#related-section").hidden = false;
  bindAddButtons($("#related"));
  initReveal();
}
      initPage();
    }
  },
  "warenkorb.html": {
    page: "shop",
    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\" data-i18n=\"nav.home\">Startseite</a> · <span data-i18n=\"cart.title\">Warenkorb</span></div>\n      <h1 data-i18n=\"cartpage.title\">Ihre Auswahl</h1>\n      <span class=\"rule\"></span>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\" id=\"cart-root\"></div>\n  </section>",
    init: function () {
function initPage() {
  renderCartPage();
  onCartChange(renderCartPage);
}

function renderCartPage() {
  const items = Cart.read();
  const root = $("#cart-root");

  if (!items.length) {
    root.innerHTML = `
      <div class="empty-state">
        <span class="eyebrow">${t("cartpage.empty.eyebrow")}</span>
        <h2>${t("cartpage.empty.title")}</h2>
        <p class="lede" style="margin-inline:auto">${t("cartpage.empty.p")}</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
          <a class="btn" href="kollektion.html">${t("cartpage.empty.cta1")}</a>
          <a class="btn btn--ghost" href="kontakt.html">${t("cartpage.empty.cta2")}</a>
        </div>
      </div>`;
    return;
  }

  const subtotal = Cart.subtotal();
  const versand = 0;
  const rabatt = Discount.betrag(subtotal);
  const gesamt = subtotal - rabatt + versand;
  const mwst = Math.round(gesamt - gesamt / 1.19);

  root.innerHTML = `
  <div class="cart-layout">
    <div>
      ${items.map((item, index) => {
        const p = findProduct(item.id);
        const x = pt(p);
        return `
        <div class="cart-item">
          <a class="cart-item__media" href="produkt.html?id=${p.id}">${artFor(p, item.colorIndex)}</a>
          <div>
            <a class="cart-item__title" href="produkt.html?id=${p.id}">${p.name}</a>
            <div class="cart-item__meta">${t("cat." + p.categoryKey)} · ${itemColor(p, item)} · ${p.used ? t("grade." + p.grade) : t("cartpage.production") + " " + x.lead}</div>
            <div style="display:flex;align-items:center;gap:1rem;margin-top:.8rem;flex-wrap:wrap">
              ${p.used ? `<span class="caption">${t("pdp.unique")}</span>` : `
              <div class="qty">
                <button data-dec="${index}" aria-label="${t("pdp.less")}">−</button>
                <span>${item.qty}</span>
                <button data-inc="${index}" aria-label="${t("pdp.more")}">+</button>
              </div>`}
              <button class="cart-item__remove" data-del="${index}" style="margin:0">${t("cart.remove")}</button>
            </div>
          </div>
          <div class="cart-item__price">${euro(p.price * item.qty)}</div>
        </div>`;
      }).join("")}

      <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2rem">
        <a class="link-underline" href="kollektion.html">${t("cart.continue")}</a>
        <button class="cart-item__remove" id="cart-clear" style="margin:0">${t("cartpage.clear")}</button>
      </div>
    </div>

    <aside class="summary">
      <h3>${t("cartpage.summary")}</h3>
      <div class="summary__row"><span>${t("cart.subtotal")}</span><span>${euro(subtotal)}</span></div>
      <div class="summary__row"><span>${t("cartpage.delivery")}</span><span>${versand === 0 ? t("cartpage.included") : euro(versand)}</span></div>
      ${rabatt > 0 ? `<div class="summary__row summary__row--discount">
        <span>${t("cartpage.discount")} · ${GUTSCHEIN.code}</span><span>−${euro(rabatt)}</span></div>` : ""}
      <div class="summary__row muted" style="font-size:.85rem"><span>${t("cartpage.vat")}</span><span>${euro(mwst)}</span></div>
      <div class="summary__row summary__row--total"><span>${t("cartpage.total")}</span><span>${euro(gesamt)}</span></div>

      <div class="code-box">
        ${rabatt > 0 ? `
          <span class="caption"><b>${GUTSCHEIN.code}</b></span>
          <button class="link-underline" id="code-remove">${t("cartpage.codeRemove")}</button>
        ` : `
          <label class="field" style="margin:0;flex:1">
            <span class="visually-hidden">${t("cartpage.codeLabel")}</span>
            <input type="text" id="code-input" placeholder="${t("cartpage.codePlaceholder")}" aria-label="${t("cartpage.codeLabel")}" autocomplete="off">
          </label>
          <button class="btn btn--ghost" id="code-apply">${t("cartpage.codeApply")}</button>
        `}
      </div>
      <p class="form-msg" id="code-msg" hidden></p>

      <button class="btn btn--block" id="checkout" style="margin-top:1.4rem">${t("cartpage.checkout")}</button>
      <p class="form-note" style="margin-top:1rem">${t("cartpage.note")}</p>
      <div class="form-msg" id="checkout-msg" hidden style="margin-top:1rem"></div>
    </aside>
  </div>`;

  $$("[data-inc]").forEach((b) => b.addEventListener("click", () =>
    Cart.setQty(Number(b.dataset.inc), items[Number(b.dataset.inc)].qty + 1)));
  $$("[data-dec]").forEach((b) => b.addEventListener("click", () =>
    Cart.setQty(Number(b.dataset.dec), items[Number(b.dataset.dec)].qty - 1)));
  $$("[data-del]").forEach((b) => b.addEventListener("click", () =>
    Cart.remove(Number(b.dataset.del))));

  $("#cart-clear").addEventListener("click", () => Cart.clear());

  $("#code-apply")?.addEventListener("click", () => {
    const feld = $("#code-input");
    const msg = $("#code-msg");
    if (Discount.einloesen(feld.value)) return;      // löst ein Neuzeichnen aus
    msg.hidden = false;
    msg.textContent = t("cartpage.codeInvalid");
    feld.focus();
  });
  $("#code-input")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#code-apply").click(); });
  $("#code-remove")?.addEventListener("click", () => Discount.entfernen());

  $("#checkout").addEventListener("click", () => {
    const msg = $("#checkout-msg");
    msg.hidden = false;
    msg.textContent = t("cartpage.demo");
  });
}
      initPage();
    }
  },
  "ueber-uns.html": {
    page: "about",
    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\" data-i18n=\"nav.home\">Startseite</a> · <span data-i18n=\"nav.about\">Studio</span></div>\n      <span class=\"eyebrow\" data-i18n=\"about.eyebrow\">Interior Design Studio</span>\n      <h1 data-i18n-html=\"about.title\">Wir gestalten Räume,<br>die über Trends hinausgehen.</h1>\n      <span class=\"rule\"></span>\n      <p class=\"lede\" data-i18n=\"about.lede\">Als Interior Design Studio mit Fokus auf ganzheitliche Planung verbinden wir höchste gestalterische Ansprüche mit technischer Präzision und tiefem Verständnis für architektonische Zusammenhänge. Wir begleiten Projekte von der ersten Idee bis zur vollständigen Umsetzung.</p>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__media\" id=\"art-1\"></div>\n    <div class=\"split__text\">\n      <span class=\"eyebrow\" data-i18n=\"about.mat.eyebrow\">Was uns auszeichnet</span>\n      <h2 data-i18n=\"about.mat.title\">Ganzheitliche Planung.</h2>\n          <span class=\"rule\"></span>\n      <p data-i18n=\"about.mat.p1\">Interior Design ist für uns mehr als Möblierung oder nur eine Küche. Es ist ein orchestriertes Zusammenspiel aus Raum, Licht, Materialität und Funktion.</p>\n      <p data-i18n=\"about.mat.p2\">Unser Planungsansatz integriert frühzeitig Architektur und individuelle Bedürfnisse — für ein Ergebnis, das sowohl visuell als auch inhaltlich überzeugt.</p>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"grid grid--3\">\n        <div class=\"value reveal\">\n          <h3 data-i18n=\"about.n1.t\">Ganzheitliche Planung</h3>\n          <p class=\"muted\" data-i18n=\"about.n1.p\">Raum, Licht, Materialität und Funktion greifen ineinander, statt nebeneinander zu stehen.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3 data-i18n=\"about.n2.t\">Individuelles Design</h3>\n          <p class=\"muted\" data-i18n=\"about.n2.p\">Jedes Projekt ist so einzigartig wie sein Kontext — abgestimmt auf Ort, Nutzung und Menschen.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3 data-i18n=\"about.n3.t\">Über Grenzen hinaus</h3>\n          <p class=\"muted\" data-i18n=\"about.n3.p\">Neben Poliform und Baxter arbeiten wir mit allen renommierten Herstellern — national und international.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"split\">\n    <div class=\"split__text split--dark\">\n      <span class=\"eyebrow\" data-i18n=\"about.proc.eyebrow\">Projektverlauf</span>\n      <h2 data-i18n=\"about.proc.title\">Vom Bedürfnis zum Raum.</h2>\n          <span class=\"rule\"></span>\n      <ol style=\"list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:1.6rem\">\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">01 — <span data-i18n=\"about.proc.s1\">Bedarfsanalyse &amp; Erstberatung</span></strong>\n          <p style=\"margin:.35rem 0 0\" data-i18n=\"about.proc.p1\">Verstehen, was wirklich zählt. Wir klären Erwartungen, funktionale Anforderungen und den gestalterischen Stil.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">02 — <span data-i18n=\"about.proc.s2\">Konzeption &amp; Entwurf</span></strong>\n          <p style=\"margin:.35rem 0 0\" data-i18n=\"about.proc.p2\">Ideen entwickeln, Räume denken — mit 3D-Visualisierungen, Moodboards, Farb- und Materialvorschlägen.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">03 — <span data-i18n=\"about.proc.s3\">Planung &amp; Detailentwicklung</span></strong>\n          <p style=\"margin:.35rem 0 0\" data-i18n=\"about.proc.p3\">Vom Konzept zur konkreten Lösung: Möblierungspläne, Lichtplanung, Maßzeichnungen, Detailplanungen.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">04 — <span data-i18n=\"about.proc.s4\">Umsetzung &amp; Bauleitung</span></strong>\n          <p style=\"margin:.35rem 0 0\" data-i18n=\"about.proc.p4\">Gestaltung wird Realität. Wir koordinieren die Gewerke und achten auf Zeit-, Kosten- und Qualitätspläne.</p></li>\n        <li><strong style=\"font-family:var(--serif);font-size:1.3rem\">05 — <span data-i18n=\"about.proc.s5\">Möblierung &amp; Übergabe</span></strong>\n          <p style=\"margin:.35rem 0 0\" data-i18n=\"about.proc.p5\">Das Detail macht den Unterschied: Möbel, Leuchten, Vorhänge, Teppiche, Kunst. Danach bleiben wir Ansprechpartner.</p></li>\n      </ol>\n    </div>\n    <div class=\"split__media\" id=\"art-2\"></div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"section-head reveal\">\n        <div>\n          <span class=\"eyebrow\" data-i18n=\"about.care.eyebrow\">Leistungen</span>\n          <h2 data-i18n=\"about.care.title\">Was wir übernehmen</h2>\n          <span class=\"rule\"></span>\n        </div>\n      </div>\n      <div class=\"acc\" style=\"max-width:820px\">\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"true\"><span data-i18n=\"about.care.leather\">Interior Design &amp; Raumkonzepte</span> <i>+</i></button>\n          <div class=\"acc__panel is-open\"><p data-i18n=\"about.care.leather.p\">Nationale und internationale Projektrealisation, Interior Design, high-end Küchen und vollständige Raumkonzepte — von der ersten Idee bis zur Übergabe.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\"><span data-i18n=\"about.care.wood\">Technische Planung</span> <i>+</i></button>\n          <div class=\"acc__panel\"><p data-i18n=\"about.care.wood.p\">Ausführungs- und Detailplanung, Möblierungs- und Lichtplanung sowie die Koordination der Schnittstellen mit externen Planern.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\"><span data-i18n=\"about.care.fabric\">Material &amp; Oberflächen</span> <i>+</i></button>\n          <div class=\"acc__panel\"><p data-i18n=\"about.care.fabric.p\">Material-, Farb- und Oberflächenberatung mit einem sicheren Gespür für Proportion, Haptik und Atmosphäre.</p></div>\n        </div>\n        <div class=\"acc__item\">\n          <button class=\"acc__btn\" aria-expanded=\"false\"><span data-i18n=\"about.care.metal\">Sonderanfertigungen</span> <i>+</i></button>\n          <div class=\"acc__panel\"><p data-i18n=\"about.care.metal.p\">Einzigartige Sonderanfertigungen auf höchstem Niveau, gefertigt mit ausgewählten Manufakturen — auch nach eigenen Entwürfen.</p></div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section\" style=\"background:var(--paper-2)\">\n    <div class=\"wrap center\">\n      <span class=\"eyebrow\" data-i18n=\"about.visit.eyebrow\">Showroom</span>\n      <h2 data-i18n=\"about.visit.title\">Poliform Showroom Hamburg</h2>\n          <span class=\"rule\"></span>\n      <p class=\"lede\" style=\"margin-inline:auto\" data-i18n-html=\"about.visit.p\">Stadthausbrücke 8 · 20355 Hamburg<br>Termine nach Vereinbarung</p>\n      <a class=\"btn\" href=\"kontakt.html\" style=\"margin-top:1rem\" data-i18n=\"about.visit.cta\">Termin vereinbaren</a>\n    </div>\n  </section>",
    init: function () {
function initPage() {
  $("#art-1").innerHTML = ART.sessel(TONES.studio);
  $("#art-2").innerHTML = ART.sofa(TONES.studio);
}
      initPage();
    }
  },
  "kontakt.html": {
    page: "contact",
    html: "<section class=\"page-head\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><a href=\"index.html\" data-i18n=\"nav.home\">Startseite</a> · <span data-i18n=\"nav.contact\">Kontakt</span></div>\n      <h1 data-i18n-html=\"contact.title\">Sprechen wir<br>über Ihren Raum.</h1>\n      <span class=\"rule\"></span>\n      <p class=\"lede\" data-i18n=\"contact.lede\">Ob eine einzelne Frage zum Material oder die Einrichtung einer ganzen Wohnung — wir nehmen uns Zeit. Antwort innerhalb eines Werktages.</p>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"wrap\">\n      <div class=\"grid grid--form\">\n\n        <form data-demo>\n          <h3 data-i18n=\"contact.form.title\">Anfrage senden</h3>\n          <div class=\"form-row\">\n            <div class=\"field\">\n              <label for=\"name\" data-i18n=\"contact.name\">Name</label>\n              <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n            </div>\n            <div class=\"field\">\n              <label for=\"email\" data-i18n=\"contact.email\">E-Mail</label>\n              <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n            </div>\n          </div>\n          <div class=\"form-row\">\n            <div class=\"field\">\n              <label for=\"phone\" data-i18n=\"contact.phone\">Telefon (optional)</label>\n              <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\">\n            </div>\n            <div class=\"field\">\n              <label for=\"topic\" data-i18n=\"contact.topic\">Anliegen</label>\n              <select id=\"topic\" name=\"topic\">\n                <option value=\"showroom\" data-i18n=\"contact.topic1\">Beratungstermin im Showroom</option>\n                <option value=\"zuhause\" data-i18n=\"contact.topic2\">Beratung bei mir zu Hause</option>\n                <option value=\"entwurf\" data-i18n=\"contact.topic3\">Frage zu einem Entwurf</option>\n                <option value=\"muster\" data-i18n=\"contact.topic4\">Materialmuster anfordern</option>\n                <option value=\"bestellung\" data-i18n=\"contact.topic5\">Bestehende Bestellung</option>\n                <option value=\"sonstiges\" data-i18n=\"contact.topic6\">Sonstiges</option>\n              </select>\n            </div>\n          </div>\n          <div class=\"field\">\n            <label for=\"message\" data-i18n=\"contact.message\">Ihre Nachricht</label>\n            <textarea id=\"message\" name=\"message\" required data-i18n-placeholder=\"contact.messagePlaceholder\" placeholder=\"Erzählen Sie uns kurz von Ihrem Raum, Ihren Maßen und Ihrem Zeitrahmen.\"></textarea>\n          </div>\n          <p class=\"form-note\" data-i18n=\"contact.privacy\">Mit dem Absenden stimmen Sie zu, dass wir Ihre Angaben zur Bearbeitung der Anfrage verwenden. Wir geben nichts an Dritte weiter.</p>\n          <button class=\"btn\" type=\"submit\" style=\"margin-top:1rem\" data-i18n=\"contact.send\">Anfrage senden</button>\n          <div class=\"form-msg\" data-msg hidden style=\"margin-top:1.2rem\"></div>\n        </form>\n\n        <aside>\n          <h3 data-i18n=\"contact.reach\">Direkt erreichbar</h3>\n          <ul class=\"specs\" style=\"margin-bottom:2.5rem\">\n            <li><span data-i18n=\"contact.phoneLabel\">Telefon</span><a href=\"tel:+4940419274600\">+49 40 41 92 74 60</a></li>\n            <li><span data-i18n=\"contact.emailLabel\">E-Mail</span><a href=\"mailto:norbert.wichele@gemail.com\">norbert.wichele@gemail.com</a></li>\n            <li><span data-i18n=\"contact.hoursLabel\">Erreichbarkeit</span><span data-i18n=\"contact.hours\">Mo–Fr 9–18 Uhr</span></li>\n          </ul>\n\n          <h3 data-i18n=\"contact.showroom\">Showroom</h3>\n          <p class=\"muted\" data-i18n-html=\"contact.address\">Stadthausbrücke 8<br>20355 Hamburg<br>Deutschland</p>\n          <ul class=\"specs\" style=\"margin-bottom:2.5rem\">\n            <li><span data-i18n=\"contact.monfri\">Montag – Freitag</span><span data-i18n=\"contact.monfriH\">10–19 Uhr</span></li>\n            <li><span data-i18n=\"contact.sat\">Samstag</span><span data-i18n=\"contact.satH\">11–17 Uhr</span></li>\n            <li><span data-i18n=\"contact.sun\">Sonntag</span><span data-i18n=\"contact.sunH\">geschlossen</span></li>\n          </ul>\n\n          <div style=\"border:1px solid var(--line);padding:1.6rem;border-radius:var(--radius);background:var(--card)\">\n            <span class=\"eyebrow\" data-i18n=\"contact.hint\">Hinweis</span>\n            <p style=\"margin:0;font-size:.92rem\" class=\"muted\" data-i18n=\"contact.hint.p\">Dies ist eine Demonstrationsseite. Das Formular sendet noch keine echten Nachrichten — die Anbindung an ein Postfach oder CRM lässt sich jederzeit ergänzen.</p>\n          </div>\n        </aside>\n\n      </div>\n    </div>\n  </section>",
    init: function () {
function initPage() {
  // Der Wert steht fest, die Beschriftung wechselt mit der Sprache —
  // so bleibt ?thema=muster in jeder Sprache gültig.
  const topic = queryParams().get("thema");
  const sel = $("#topic");
  if (topic && [...sel.options].some((o) => o.value === topic)) sel.value = topic;
}
      initPage();
    }
  }
};

function currentRoute() {
  const hash = location.hash.replace(/^#/, "");
  const file = (hash.split("?")[0] || "index.html").trim();
  return ROUTES[file] ? file : "index.html";
}

function renderRoute() {
  const key = currentRoute();
  const route = ROUTES[key];

  clearPageListeners();
  document.dispatchEvent(new Event("route:changed"));
  document.body.dataset.page = route.page;
  document.querySelectorAll("#nav a").forEach(function (a) {
    a.classList.toggle("is-active", a.getAttribute("href") === key);
  });

  const app = document.getElementById("app");
  app.innerHTML = route.html;
  applyI18n(app);
  route.init();
  applyI18n(app);
  bindAddButtons(app);
  initAccordions(app);
  initForms();
  initReveal();
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* Interne Verweise auf die Raute umlenken */
document.addEventListener("click", function (e) {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || !/^[\w-]+\.html(\?|$)/.test(href)) return;
  e.preventDefault();
  const next = "#" + href;
  if (location.hash === next) renderRoute();
  else location.hash = next;
});

function boot() {
  if (!document.getElementById("nav")) renderChrome();
  renderRoute();
}

window.__renderRoute = renderRoute;
window.addEventListener("hashchange", renderRoute);
document.addEventListener("DOMContentLoaded", renderRoute);
if (document.readyState !== "loading") boot();
</script>
