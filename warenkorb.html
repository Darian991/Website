<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.cart">Warenkorb — Studio Lusso</title>
<meta name="description" data-i18n-content="desc.cart" content="Ihre Auswahl bei Studio Lusso — mit Zustand, Verfügbarkeit und Lieferung bis in den Raum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="site-header">
<noscript>
  <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  <div class="topbar">Poliform Showroom Hamburg · Beratung nach Vereinbarung unter +49 40 41 92 74 60</div>
  <header class="header"><div class="wrap header__inner">
    <a class="logo" href="index.html"><span class="logo__mark">SL</span><span class="logo__name">Studio Lusso<small>Interior Design Concepts</small></span></a>
    <nav class="nav-static">
      <a href="index.html">Startseite</a>
      <a href="kollektion.html" class="is-active">Kollektion</a>
      <a href="ueber-uns.html">Studio</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div></header>
</noscript>
</div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home">Startseite</a> · <span data-i18n="cart.title">Warenkorb</span></div>
      <h1 data-i18n="cartpage.title">Ihre Auswahl</h1>
      <span class="rule"></span>
    </div>
  </section>

  <section class="section">
    <div class="wrap" id="cart-root"></div>
  </section>
</main>

<div id="site-footer">
<noscript>
  <footer class="footer"><div class="wrap">
    <p>Wir gestalten Räume, die über Trends hinausgehen: zeitlos, durchdacht, elegant und authentisch.</p>
    <p>Stadthausbrücke 8 · 20355 Hamburg · <a href="tel:+4940419274600">+49 40 41 92 74 60</a> ·
       <a href="mailto:norbert.wichele@gemail.com">norbert.wichele@gemail.com</a></p>
    <p class="muted">Warenkorb, Suche und Sprachwahl brauchen JavaScript.</p>
  </div></footer>
</noscript>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/berater.js"></script>
<script>
function initPage() {
  renderCartPage();
  onCartChange(renderCartPage);
}

function renderCartPage() {
  const items = Cart.read();
  const root = $("#cart-root");

  if (!items.length) {
    root.innerHTML = `
      <div class="empty-state">
        <span class="eyebrow">${t("cartpage.empty.eyebrow")}</span>
        <h2>${t("cartpage.empty.title")}</h2>
        <p class="lede" style="margin-inline:auto">${t("cartpage.empty.p")}</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">
          <a class="btn" href="kollektion.html">${t("cartpage.empty.cta1")}</a>
          <a class="btn btn--ghost" href="kontakt.html">${t("cartpage.empty.cta2")}</a>
        </div>
      </div>`;
    return;
  }

  const subtotal = Cart.subtotal();
  const versand = 0;
  const rabatt = Discount.betrag(subtotal);
  const gesamt = subtotal - rabatt + versand;
  const mwst = Math.round(gesamt - gesamt / 1.19);

  root.innerHTML = `
  <div class="cart-layout">
    <div>
      ${items.map((item, index) => {
        const p = findProduct(item.id);
        const x = pt(p);
        return `
        <div class="cart-item">
          <a class="cart-item__media" href="produkt.html?id=${p.id}">${artFor(p, item.colorIndex)}</a>
          <div>
            <a class="cart-item__title" href="produkt.html?id=${p.id}">${p.name}</a>
            <div class="cart-item__meta">${t("cat." + p.categoryKey)} · ${itemColor(p, item)} · ${p.used ? t("grade." + p.grade) : t("cartpage.production") + " " + x.lead}</div>
            <div style="display:flex;align-items:center;gap:1rem;margin-top:.8rem;flex-wrap:wrap">
              ${p.used ? `<span class="caption">${t("pdp.unique")}</span>` : `
              <div class="qty">
                <button data-dec="${index}" aria-label="${t("pdp.less")}">−</button>
                <span>${item.qty}</span>
                <button data-inc="${index}" aria-label="${t("pdp.more")}">+</button>
              </div>`}
              <button class="cart-item__remove" data-del="${index}" style="margin:0">${t("cart.remove")}</button>
            </div>
          </div>
          <div class="cart-item__price">${euro(p.price * item.qty)}</div>
        </div>`;
      }).join("")}

      <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2rem">
        <a class="link-underline" href="kollektion.html">${t("cart.continue")}</a>
        <button class="cart-item__remove" id="cart-clear" style="margin:0">${t("cartpage.clear")}</button>
      </div>
    </div>

    <aside class="summary">
      <h3>${t("cartpage.summary")}</h3>
      <div class="summary__row"><span>${t("cart.subtotal")}</span><span>${euro(subtotal)}</span></div>
      <div class="summary__row"><span>${t("cartpage.delivery")}</span><span>${versand === 0 ? t("cartpage.included") : euro(versand)}</span></div>
      ${rabatt > 0 ? `<div class="summary__row summary__row--discount">
        <span>${t("cartpage.discount")} · ${GUTSCHEIN.code}</span><span>−${euro(rabatt)}</span></div>` : ""}
      <div class="summary__row muted" style="font-size:.85rem"><span>${t("cartpage.vat")}</span><span>${euro(mwst)}</span></div>
      <div class="summary__row summary__row--total"><span>${t("cartpage.total")}</span><span>${euro(gesamt)}</span></div>

      <div class="code-box">
        ${rabatt > 0 ? `
          <span class="caption"><b>${GUTSCHEIN.code}</b></span>
          <button class="link-underline" id="code-remove">${t("cartpage.codeRemove")}</button>
        ` : `
          <label class="field" style="margin:0;flex:1">
            <span class="visually-hidden">${t("cartpage.codeLabel")}</span>
            <input type="text" id="code-input" placeholder="${t("cartpage.codePlaceholder")}" aria-label="${t("cartpage.codeLabel")}" autocomplete="off">
          </label>
          <button class="btn btn--ghost" id="code-apply">${t("cartpage.codeApply")}</button>
        `}
      </div>
      <p class="form-msg" id="code-msg" hidden></p>

      <button class="btn btn--block" id="checkout" style="margin-top:1.4rem">${t("cartpage.checkout")}</button>
      <p class="form-note" style="margin-top:1rem">${t("cartpage.note")}</p>
      <div class="form-msg" id="checkout-msg" hidden style="margin-top:1rem"></div>
    </aside>
  </div>`;

  $$("[data-inc]").forEach((b) => b.addEventListener("click", () =>
    Cart.setQty(Number(b.dataset.inc), items[Number(b.dataset.inc)].qty + 1)));
  $$("[data-dec]").forEach((b) => b.addEventListener("click", () =>
    Cart.setQty(Number(b.dataset.dec), items[Number(b.dataset.dec)].qty - 1)));
  $$("[data-del]").forEach((b) => b.addEventListener("click", () =>
    Cart.remove(Number(b.dataset.del))));

  $("#cart-clear").addEventListener("click", () => Cart.clear());

  $("#code-apply")?.addEventListener("click", () => {
    const feld = $("#code-input");
    const msg = $("#code-msg");
    if (Discount.einloesen(feld.value)) return;      // löst ein Neuzeichnen aus
    msg.hidden = false;
    msg.textContent = t("cartpage.codeInvalid");
    feld.focus();
  });
  $("#code-input")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#code-apply").click(); });
  $("#code-remove")?.addEventListener("click", () => Discount.entfernen());

  $("#checkout").addEventListener("click", () => {
    const msg = $("#checkout-msg");
    msg.hidden = false;
    msg.textContent = t("cartpage.demo");
  });
}
</script>
</body>
</html>
