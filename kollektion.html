<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="shop">
<div id="site-header">
<noscript>
  <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  <div class="topbar">Poliform Showroom Hamburg · Beratung nach Vereinbarung unter +49 40 41 92 74 60</div>
  <header class="header"><div class="wrap header__inner">
    <a class="logo" href="index.html"><span class="logo__mark">SL</span><span class="logo__name">Studio Lusso<small>Interior Design Concepts</small></span></a>
    <nav class="nav-static">
      <a href="index.html">Startseite</a>
      <a href="kollektion.html" class="is-active">Kollektion</a>
      <a href="ueber-uns.html">Studio</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div></header>
</noscript>
</div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home">Startseite</a> · <span data-i18n="nav.shop">Kollektion</span></div>
      <h1 data-i18n="shop.title">Die Kollektion</h1>
      <span class="rule"></span>
      <p class="lede" data-i18n="shop.lede">Sechzehn Stücke, die wir derzeit anbieten. Alles stammt aus zweiter Hand — Möbel wie Leuchten sind Einzelstücke und jeweils nur einmal zu haben.</p>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2.5rem,5vw,4rem)">
    <div class="wrap">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
          <label class="shop-search">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.6" y1="12.6" x2="17.5" y2="17.5" stroke-linecap="round"/>
            </svg>
            <input type="search" id="shop-search" data-i18n-placeholder="shop.searchPlaceholder" data-i18n-aria="shop.search" autocomplete="off" placeholder="Name, Kategorie oder Material" aria-label="Suchen">
            <button type="button" id="shop-search-clear" data-i18n-aria="search.clear" hidden aria-label="Suche zurücksetzen">×</button>
          </label>
          <div class="sort">
            <label for="sort" data-i18n="shop.sort">Sortieren</label>
            <select id="sort">
              <option value="empfohlen" data-i18n="shop.sort.featured">Empfohlen</option>
              <option value="preis-auf" data-i18n="shop.sort.priceUp">Preis aufsteigend</option>
              <option value="preis-ab" data-i18n="shop.sort.priceDown">Preis absteigend</option>
              <option value="name" data-i18n="shop.sort.name">Name A–Z</option>
            </select>
          </div>
        </div>
      </div>

      <p class="muted" id="result-count" style="font-size:.85rem;letter-spacing:.1em;text-transform:uppercase"></p>
      <div class="grid grid--3" id="products" style="margin-top:1.5rem"></div>
    </div>
  </section>
</main>

<div id="site-footer">
<noscript>
  <footer class="footer"><div class="wrap">
    <p>Wir gestalten Räume, die über Trends hinausgehen: zeitlos, durchdacht, elegant und authentisch.</p>
    <p>Stadthausbrücke 8 · 20355 Hamburg · <a href="tel:+4940419274600">+49 40 41 92 74 60</a> ·
       <a href="mailto:info@studio-lusso.de">info@studio-lusso.de</a></p>
    <p class="muted">Warenkorb, Suche und Sprachwahl brauchen JavaScript.</p>
  </div></footer>
</noscript>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/berater.js"></script>
<script>
let activeCat = "alle";
let activeQuery = "";
let ersterAufbau = true;

function initPage() {
  const params = queryParams();
  activeCat = categoryKeyFrom(params.get("kategorie")) || "alle";
  activeQuery = params.get("suche") || "";

  $("#filters").innerHTML = CATEGORY_KEYS.map((c) =>
    `<button class="chip ${c === activeCat ? "is-active" : ""}" data-cat="${c}">${t("cat." + c)}</button>`).join("");

  $$("#filters .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      activeCat = chip.dataset.cat;
      $$("#filters .chip").forEach((c) => c.classList.toggle("is-active", c === chip));
      setParam("kategorie", activeCat === "alle" ? null : activeCat);
      renderList();
    });
  });

  const field = $("#shop-search");
  field.value = activeQuery;
  field.addEventListener("input", () => {
    activeQuery = field.value;
    setParam("suche", activeQuery.trim() ? activeQuery.trim() : null);
    renderList();
  });
  $("#shop-search-clear").addEventListener("click", () => {
    field.value = "";
    activeQuery = "";
    setParam("suche", null);
    renderList();
    field.focus();
  });

  $("#sort").addEventListener("change", renderList);
  renderList();
}

function renderList() {
  const query = activeQuery.trim();
  let list = query ? searchProducts(query) : [...PRODUCTS];
  if (activeCat !== "alle") list = list.filter((p) => p.categoryKey === activeCat);

  switch ($("#sort").value) {
    case "preis-auf": list.sort((a, b) => a.price - b.price); break;
    case "preis-ab":  list.sort((a, b) => b.price - a.price); break;
    case "name":      list.sort((a, b) => a.name.localeCompare(b.name, getLang())); break;
  }

  $("#shop-search-clear").hidden = !query;

  const parts = [list.length === 1 ? t("shop.count.one") : t("shop.count.many", { n: list.length })];
  if (activeCat !== "alle") parts.push(t("cat." + activeCat));
  if (query) parts.push(t("shop.for") + " „" + query + "“");
  $("#result-count").textContent = parts.join(" · ");

  const grid = $("#products");
  grid.innerHTML = list.length
    ? list.map(productCard).join("")
    : `<p class="muted">${t("shop.empty")}</p>`;

  bindAddButtons(grid);
  // Beim ersten Aufbau sanft einblenden, danach sofort zeigen — sonst
  // flackert die Liste bei jedem Tastendruck in der Suche.
  if (ersterAufbau) { initReveal(); ersterAufbau = false; }
  else $$("#products .card").forEach((c) => c.classList.add("is-visible"));
}
</script>
</body>
</html>
