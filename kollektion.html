<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.shop">Kollektion — Maison Noir</title>
<meta name="description" content="Die gesamte Kollektion von Maison Noir: Sofas, Sessel, Tische, Stühle, Leuchten, Aufbewahrung und Betten aus handwerklicher Fertigung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home"></a> · <span data-i18n="nav.shop"></span></div>
      <h1 data-i18n="shop.title"></h1>
      <p class="lede" data-i18n="shop.lede"></p>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2.5rem,5vw,4rem)">
    <div class="wrap">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
          <label class="shop-search">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.6" y1="12.6" x2="17.5" y2="17.5" stroke-linecap="round"/>
            </svg>
            <input type="search" id="shop-search" data-i18n-placeholder="shop.searchPlaceholder" data-i18n-aria="shop.search" autocomplete="off">
            <button type="button" id="shop-search-clear" data-i18n-aria="search.clear" hidden>×</button>
          </label>
          <div class="sort">
            <label for="sort" data-i18n="shop.sort"></label>
            <select id="sort">
              <option value="empfohlen" data-i18n="shop.sort.featured"></option>
              <option value="preis-auf" data-i18n="shop.sort.priceUp"></option>
              <option value="preis-ab" data-i18n="shop.sort.priceDown"></option>
              <option value="name" data-i18n="shop.sort.name"></option>
            </select>
          </div>
        </div>
      </div>

      <p class="muted" id="result-count" style="font-size:.85rem;letter-spacing:.1em;text-transform:uppercase"></p>
      <div class="grid grid--3" id="products" style="margin-top:1.5rem"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
let activeCat = "alle";
let activeQuery = "";

function initPage() {
  const params = queryParams();
  const wantedCat = params.get("kategorie");
  if (wantedCat && CATEGORY_KEYS.includes(wantedCat)) activeCat = wantedCat;
  activeQuery = params.get("suche") || "";

  $("#filters").innerHTML = CATEGORY_KEYS.map((c) =>
    `<button class="chip ${c === activeCat ? "is-active" : ""}" data-cat="${c}">${t("cat." + c)}</button>`).join("");

  $$("#filters .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      activeCat = chip.dataset.cat;
      $$("#filters .chip").forEach((c) => c.classList.toggle("is-active", c === chip));
      setParam("kategorie", activeCat === "alle" ? null : activeCat);
      renderList();
    });
  });

  const field = $("#shop-search");
  field.value = activeQuery;
  field.addEventListener("input", () => {
    activeQuery = field.value;
    setParam("suche", activeQuery.trim() ? activeQuery.trim() : null);
    renderList();
  });
  $("#shop-search-clear").addEventListener("click", () => {
    field.value = "";
    activeQuery = "";
    setParam("suche", null);
    renderList();
    field.focus();
  });

  $("#sort").addEventListener("change", renderList);
  renderList();
}

function renderList() {
  const query = activeQuery.trim();
  let list = query ? searchProducts(query) : [...PRODUCTS];
  if (activeCat !== "alle") list = list.filter((p) => p.categoryKey === activeCat);

  switch ($("#sort").value) {
    case "preis-auf": list.sort((a, b) => a.price - b.price); break;
    case "preis-ab":  list.sort((a, b) => b.price - a.price); break;
    case "name":      list.sort((a, b) => a.name.localeCompare(b.name, getLang())); break;
  }

  $("#shop-search-clear").hidden = !query;

  const parts = [list.length === 1 ? t("shop.count.one") : t("shop.count.many", { n: list.length })];
  if (activeCat !== "alle") parts.push(t("cat." + activeCat));
  if (query) parts.push(t("shop.for") + " „" + query + "“");
  $("#result-count").textContent = parts.join(" · ");

  const grid = $("#products");
  grid.innerHTML = list.length
    ? list.map(productCard).join("")
    : `<p class="muted">${t("shop.empty")}</p>`;

  bindAddButtons(grid);
  initReveal();
}
</script>
</body>
</html>
